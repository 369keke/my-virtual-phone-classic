 16 3.5Z"/><circle cx="10" cy="15.5" r="1.1"/><circle cx="16" cy="15.5" r="1.1"/><circle cx="22" cy="15.5" r="1.1"/></svg><span id="xhsCommentCount">0</span></button></div></section>

>公开 0　　私密 0　　合集 0</div><div class="xhs-post-grid" id="xhsMyPosts"><div class="xhs-post-empty">还没有发布笔记</div></div></div><nav class="xhs-bottom"><button id="xhsProfileHome">首页</button><button>市集</button><button class="xhs-plus" id="xhsPublish2">＋</button><button>消息</button><button>我</button></nav></section><section class="view" id="meView"><div style="padding:22px 16px;background:white;display:flex;align-items:center;gap:14px" id="myProfile"></div><div class="list" style="margin-top:12px"><button class="row" id="managePeople"><span class="avatar">👥</span><span class="row-main">人物管理</span><span>›</span></button><button class="row" id="createGroup"><span class="avatar">💬</span><span class="row-main">发起群聊</span><span>›</span></button><button class="row" id="backupData"><span class="avatar">📦</span><span class="row-main">数据备份与恢复<div class="small">导出或导入人物、头像和聊天记录</div></span><span>›</span></button></div></section>

<script>
const $=id=>document.getElementById(id), KEY='wx_simulator_v1';
let db;try{db=JSON.parse(localStorage.getItem(KEY))||{people:[],chats:[],meId:null}}catch(e){db={people:[],chats:[],meId:null}}
const save=()=>localStorage.setItem(KEY,JSON.stringify(db));
const person=id=>db.people.find(p=>p.id===id);
const activeChat=()=>db.chats.find(c=>c.id===currentChat);
let currentChat=null,currentView='chatsView',senderId=null;
function avatar(p){return p?.avatar?'<img class="avatar" src="'+p.avatar+'">':'<span class="avatar">'+(p?.emoji||'🙂')+'</span>'}
const emojiSets=[{name:'最近使用',icon:'◷',items:[]},{name:'笑脸',icon:'☺',items:Array.from('😀 😃 😄 😁 😆 😅 😂 🤣 🥲 😊 😇 🙂 🙃 😉 😌 😍 🥰 😘 😋 😛 😜 🤪 😝 🤗 🤭 🫢 🫣 🤫 🤔 😐 😑 😶 😏 😒 🙄 😬 😔 😪 😴 😷 🤒 🤢 🤮 🥵 🥶 🥴 😵 🤯 🥳 😎 🤓 🧐 😕 😟 🙁 ☹️ 😮 😯 😲 😳 🥺 🥹 😨 😰 😢 😭 😱 😖 😞 😩 😫 🥱 😤 😡 😠 🤬 😈 💀 💩 🤡 👻 👽 🤖'.split(' '))},{name:'手势',icon:'👍',items:Array.from('👋 🤚 🖐️ ✋ 👌 🤌 🤏 ✌️ 🤞 🫰 🤟 🤘 🤙 👈 👉 👆 🖕 👇 ☝️ 👍 👎 ✊ 👊 👏 🙌 👐 🤲 🤝 🙏 💪'.split(' '))},{name:'爱心',icon:'❤️',items:Array.from('❤️ 🩷 🧡 💛 💚 💙 🩵 💜 🤎 🖤 🤍 💔 💕 💞 💓 💗 💖 💘 💝 💟'.split(' '))},{name:'动物',icon:'🐱',items:Array.from('🐶 🐱 🐭 🐹 🐰 🦊 🐻 🐼 🐨 🐯 🦁 🐮 🐷 🐸 🐵 🙈 🙉 🙊 🐔 🐧 🐦 🦄 🐝 🦋 🐢 🐙 🦀 🐬 🐳 🦖'.split(' '))},{name:'食物',icon:'🍎',items:Array.from('🍏 🍎 🍐 🍊 🍋 🍌 🍉 🍇 🍓 🫐 🍒 🍑 🥭 🍍 🥝 🍅 🥑 🍆 🥔 🥕 🌽 🌶️ 🥒 🥬 🥦 🍞 🥐 🧀 🍔 🍟 🍕 🍿 🍩 🍪 🎂 🍰 ☕ 🍵 🧋'.split(' '))},{name:'其他',icon:'🎉',items:Array.from('🌈 ☀️ ⭐ 🌙 ⚡ 🔥 💧 🌸 🌹 🌻 🍀 🎉 🎊 🎁 🎈 🏆 ⚽ 🎮 🚗 ✈️ 🏠 📱 💻 📷 💡 💰 💎'.split(' '))},{name:'我的收藏',icon:'⭐',items:[]}];
let recentEmojis=JSON.parse(localStorage.getItem('wx_recent_emoji')||'[]');
let myStickers=JSON.parse(localStorage.getItem('wx_my_stickers')||'[]');
function renderEmojiTab(index=0){const set=emojiSets[index];$('emojiLabel').textContent=set.name;const items=index===0?recentEmojis:index===7?myStickers:set.items;$('emojiGrid').innerHTML=items.map((e,i)=>index===7?'<button type="button" data-sticker="'+i+'"><img src="'+e.data+'" style="width:48px;height:48px;object-fit:contain"><small>×</small></button>':'<button type="button" data-emoji="'+e+'">'+e+'</button>').join('')||'<div class="small" style="grid-column:1/-1;padding:18px">这里还没有内容</div>';$('emojiGrid').querySelectorAll('[data-emoji]').forEach(b=>b.onclick=()=>{const input=$('messageInput');input.value+=b.dataset.emoji;input.focus();recentEmojis=[b.dataset.emoji,...recentEmojis.filter(x=>x!==b.dataset.emoji)].slice(0,24);localStorage.setItem('wx_recent_emoji',JSON.stringify(recentEmojis))});$('emojiGrid').querySelectorAll('[data-sticker]').forEach(b=>b.onclick=()=>sendFavoriteSticker(Number(b.dataset.sticker)));$('emojiTabs').querySelectorAll('button').forEach((b,i)=>b.classList.toggle('on',i===index))}
function sendFavoriteSticker(i){const c=activeChat(),st=myStickers[i];if(!c||!st)return;c.messages.push({id:crypto.randomUUID(),sender:senderId||c.viewAs||c.personIds[0],type:'sticker',data:st.data,time:new Date().toLocaleTimeString()});save();renderMessages()}
function toggleEmojiPanel(){const p=$('emojiPanel');p.classList.toggle('hidden');if(!p.classList.contains('hidden')){if(!$('emojiTabs').children.length){$('emojiTabs').innerHTML=emojiSets.map(x=>'<button type="button" title="'+x.name+'">'+x.icon+'</button>').join('');$('emojiTabs').querySelectorAll('button').forEach((b,i)=>b.onclick=()=>renderEmojiTab(i))}renderEmojiTab(0)}}
$('stickerUpload').onchange=e=>{[...e.target.files].forEach(file=>{if(!file.type.startsWith('image/'))return;if(file.size>2*1024*1024){alert(file.name+' 超过2MB，请压缩后上传');return}const reader=new FileReader();reader.onload=()=>{myStickers.push({name:file.name,data:reader.result});try{localStorage.setItem('wx_my_stickers',JSON.stringify(myStickers));if($('emojiTabs').children.length)renderEmojiTab(7)}catch(err){myStickers.pop();alert('收藏失败：浏览器存储空间可能不足，请换用较小的图片')}};reader.readAsDataURL(file)});e.target.value=''};
function showView(id){currentView=id;document.querySelectorAll('.view').forEach(v=>v.classList.toggle('active',v.id===id));$('tabs').classList.toggle('hidden',!['chatsView','contactsView','meView'].includes(id));$('mainbar').classList.toggle('hidden',!['chatsView','contactsView','meView'].includes(id));document.querySelectorAll('.tabs button').forEach(b=>b.classList.toggle('on',b.dataset.view===id));if(id==='chatsView')renderChats();if(id==='contactsView')renderContacts();if(id==='meView')renderMe();if(id==='xhsProfileView')renderXhsProfile()}
function initXhsEditorExtras(){let selectedLocation='';$('xhsSaveDraft').onclick=()=>{const d={title:$('xhsCreateTitle').value,text:$('xhsCreateText').value,topics:$('xhsCreateTopics').value,date:$('xhsCreateDate').value,ip:$('xhsCreateIp').value,location:selectedLocation};try{localStorage.setItem('xhs_note_draft',JSON.stringify(d));alert('草稿已保存在这台设备上')}catch(e){alert('草稿保存失败')}};$('xhsAddTopic').onclick=()=>{const v=prompt('输入话题名称');if(v?.trim()){$('xhsCreateTopics').value+=($('xhsCreateTopics').value?' ':'')+'#'+v.trim()}};$('xhsAddMention').onclick=()=>{const v=prompt('输入要@的用户昵称');if(v?.trim())$('xhsCreateText').value+=' @'+v.trim()};$('xhsAddPoll').onclick=()=>{const q=prompt('输入投票问题');if(!q)return;const a=prompt('输入投票选项，用逗号分隔','选项一,选项二');if(a)$('xhsCreateText').value+='\\n\\n投票：'+q+'\\n'+a.split(',').map((v,i)=>(i+1)+'. '+v.trim()).join('\\n')};$('xhsLocationRow').onclick=()=>{const v=prompt('输入地点名称');if(v!==null){selectedLocation=v.trim();$('xhsLocationText').textContent=(selectedLocation||'未设置')+'　›'}};$('xhsVisibilityRow').onclick=()=>{const v=prompt('输入 1 所有人可见、2 部分人可见、3 仅自己可见','1');$('xhsVisibilityText').textContent=v==='2'?'部分人可见　›':v==='3'?'仅自己可见　›':'所有人可见　›'};$('xhsComponentsRow').onclick=()=>{$('xhsOptionalFields').classList.toggle('show')};$('xhsScheduleBtn').onclick=()=>alert('发日常模式暂未接入，普通笔记发布和草稿保存可以使用。');$('xhsVoiceDraft').onclick=()=>alert('语音输入入口已预留，可以先直接编辑正文。');$('xhsPreviewClose').onclick=()=>$('xhsPreviewPanel').classList.add('hidden');const originalPublish=$('xhsCreatePublish').onclick;$('xhsCreatePublish').onclick=async()=>{await originalPublish?.();};}
document.addEventListener('DOMContentLoaded',()=>{initXhsComposer();initXhsEditorExtras()},{once:true});
function openModal(html){$('sheet').innerHTML=html;$('modal').classList.add('show')}
function closeModal(){$('modal').classList.remove('show')}
$('modal').addEventListener('click',e=>{if(e.target===$('modal'))closeModal()});$('launchWechat').onclick=()=>showView('chatsView');$('launchXhs').onclick=openXhs;$('toLauncher').onclick=()=>showView('launcherView');$('xhsMeTab').onclick=()=>showView('xhsProfileView');$('xhsProfileHome').onclick=$('xhsHomeTab').onclick=()=>showView('xhsHomeView');$('xhsBackHome').onclick=()=>showView('launcherView');$('xhsPublish').onclick=$('xhsPublish2').onclick=publishXhs;$('xhsEditProfile').onclick=()=>xhsProfileMode==='own'?editXhsProfile():editXhsVisitorProfile();$('xhsProfileTabs').querySelectorAll('[data-profile-tab]').forEach(b=>b.onclick=()=>{if(xhsProfileMode==='visitor'){xhsVisitorTab=b.dataset.profileTab==='favorites'?'favorites':'notes';renderXhsProfile()}else if(b.dataset.profileTab==='notes'){renderXhsProfile()}else{$('xhsMyPosts').innerHTML='<div class="xhs-post-empty">暂无内容</div>'}});$('xhsVisitorFollow').onclick=()=>{const b=$('xhsVisitorFollow');b.textContent=b.textContent==='关注'?'已关注':'关注';b.style.background=b.textContent==='已关注'?'#777':'#ff2442'};$('xhsVisitorMessage').onclick=()=>alert('私信入口已预留，当前为模拟主页展示。');$('xhsSearch').onclick=()=>alert('搜索功能后续可以添加');$('xhsMessage').onclick=()=>alert('暂未添加消息功能');$('launcherClock').textContent=new Date().toLocaleTimeString('zh-CN',{hour:'2-digit',minute:'2-digit'});
function renderChats(){const box=$('chatList');if(!db.chats.length){box.innerHTML='<div class="empty">还没有聊天<br><br>点击右上角 ＋ 添加人物或创建群聊</div>';return}box.innerHTML=db.chats.map(c=>{const last=c.messages.at(-1);const title=c.type==='group'?c.name:(person(c.personIds.find(id=>id!==db.meId))?.name||'聊天');const p=person(c.personIds.find(id=>id!==db.meId));return '<button class="row" data-chat="'+c.id+'">'+(c.type==='group'?'<span class="avatar">👥</span>':avatar(p))+'<span class="row-main"><span class="row-title">'+esc(title)+'</span><span class="row-sub">'+esc(last?.text||'暂无消息')+'</span></span><span class="small">'+(last?last.time:'')+'</span></button>'}).join('');box.querySelectorAll('[data-chat]').forEach(b=>b.onclick=()=>openChat(b.dataset.chat))}

     hint.className='xhs-profile-add-hint';
     hint.textContent='长按下方空白处，发布新笔记';
     grid.appendChild(hint);
   }
   if(grid.dataset.blankLongBound)return;
   grid.dataset.blankLongBound='1';
   let timer=null,fired=false,startX=0,startY=0;

     if(xhsProfileMode!=='own'||e.target.closest('.xhs-profile-post'))return;

/* Fixed-ratio image cropper for profile avatar and cover */
const xhsPendingCrops={avatar:null,background:null,visitorAvatar:null,visitorBackground:null};
function xhsOpenCropper(file,kind){
 return new Promise((resolve,reject)=>{
  if(!file||!file.type.startsWith('image/')){reject(new Error('请选择图片'));return}
  const url=URL.createObjectURL(file),avatar=kind.toLowerCase().includes('avatar');
  const ratio=avatar?1:(7/5);
  const frameW=Math.min(340,window.innerWidth-44),frameH=frameW/ratio;
  const overlay=document.createElement('div');overlay.className='xhs-crop-overlay';
  overlay.innerHTML='<div class="xhs-crop-title">'+(avatar?'调整头像':'调整主页背景')+'</div><div class="xhs-crop-frame '+(avatar?'avatar':'')+'" style="width:'+frameW+'px;height:'+frameH+'px"><img draggable="false"></div><div class="xhs-crop-tip">拖动图片调整位置，滑动下方滑块调整大小</div><div class="xhs-crop-controls"><input type="range" min="1" max="3" step=".01" value="1"></div><div class="xhs-crop-actions"><button type="button" class="cancel">取消</button><button type="button" class="save">保存</button></div>';
  document.body.appendChild(overlay);
  const frame=overlay.querySelector('.xhs-crop-frame'),img=overlay.querySelector('img'),slider=overlay.querySelector('input');
  let base=1,zoom=1,left=0,top=0,drag=null,done=false;
  const finish=(value,error)=>{if(done)return;done=true;URL.revokeObjectURL(url);overlay.remove();error?reject(error):resolve(value)};
  img.onload=()=>{
    base=Math.max(frameW/img.naturalWidth,frameH/img.naturalHeight);
    const draw=()=>{const w=img.naturalWidth*base*zoom,hh=img.naturalHeight*base*zoom;left=Math.min(0,Math.max(frameW-w,left));top=Math.min(0,Math.max(frameH-hh,top));img.style.width=w+'px';img.style.height=hh+'px';img.style.left=left+'px';img.style.top=top+'px'};
    left=(frameW-img.naturalWidth*base)/2;top=(frameH-img.naturalHeight*base)/2;draw();
    slider.oninput=()=>{const old=zoom;zoom=Number(slider.value);const cx=frameW/2,cy=frameH/2;left=cx-(cx-left)*(zoom/old);top=cy-(cy-top)*(zoom/old);draw()};
    frame.onpointerdown=e=>{drag={x:e.clientX,y:e.clientY,left,top};frame.setPointerCapture(e.pointerId)};
    frame.onpointermove=e=>{if(!drag)return;left=drag.left+e.clientX-drag.x;top=drag.top+e.clientY-drag.y;draw()};
    frame.onpointerup=frame.onpointercancel=()=>{drag=null};
  };
  img.onerror=()=>finish(null,new Error('图片读取失败'));
  img.src=url;
  overlay.querySelector('.cancel').onclick=()=>finish(null,new Error('已取消裁剪'));
  overlay.querySelector('.save').onclick=()=>{
    try{
      const out=document.createElement('canvas'),size=avatar?640:1400;
      out.width=size;out.height=size/ratio;
      const ctx=out.getContext('2d'),scale=base*zoom;
      const sx=Math.max(0,-left/scale),sy=Math.max(0,-top/scale);
      const sw=frameW/scale,sh=frameH/scale;
      ctx.drawImage(img,sx,sy,sw,sh,0,0,out.width,out.height);
      finish(out.toDataURL('image/jpeg',.82));
    }catch(e){finish(null,e)}
  };
 });
}

/* Normalize thumbnail ratios while preserving full image in note detail */
function xhsApplyThumbnailRatios(root){
 (root||document).querySelectorAll('.xhs-card-image').forEach(img=>{
  const apply=()=>{
   if(!img.naturalWidth||!img.naturalHeight)return;
   const ratio=img.naturalWidth/img.naturalHeight;
   const choices=[4/3,1,3/4];
   let best=choices[0],distance=Infinity;
   choices.forEach(v=>{const d=Math.abs(Math.log(ratio/v));if(d<distance){distance=d;best=v}});
   const width=img.getBoundingClientRect().width||img.parentElement.getBoundingClientRect().width;
   if(!width)return;
   img.style.aspectRatio=best+ '/1';
   img.style.display='block';img.style.width='100%';img.style.height=(width/best)+'px';img.style.maxHeight='none';img.style.objectFit='cover';
  };
  if(img.complete)apply();else img.addEventListener('load',apply,{once:true});
 });
}
const xhsOriginalRenderFeed=renderXhsFeed;

const xhsOriginalRenderProfile=renderXhsProfile;
