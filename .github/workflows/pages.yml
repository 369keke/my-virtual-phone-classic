name: Deploy static site and embedded Fake World WeChat to GitHub Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout phone project
        uses: actions/checkout@v4
        with:
          path: phone

      - name: Checkout Fake World source
        uses: actions/checkout@v4
        with:
          repository: LiangNiang/fake-world
          ref: main
          path: fake-world

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.1.3

      - name: Configure Fake World for this Pages subpath
        working-directory: fake-world
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path("packages/web/vite.config.ts")
          s = p.read_text()
          s = s.replace('export default defineConfig({', 'export default defineConfig({\n\tbase: "/my-virtual-phone-classic/wechat/",')
          p.write_text(s)
          p = Path("packages/web/src/main.tsx")
          s = p.read_text().replace('createBrowserRouter(routes)', 'createBrowserRouter(routes, { basename: "/my-virtual-phone-classic/wechat" })')
          p.write_text(s)
          # 将通讯录右上角加号改为微信内可直接使用的添加联系人弹窗
          p = Path("packages/web/src/pages/wechat/contacts/index.tsx")
          s = p.read_text()
          s = "\\n".join(line for line in s.splitlines() if not any(token in line for token in [
              "import { activatedNodeAtom }", "import { modeAtom }", "import { useSetAtom }",
              "const setMode = useSetAtom(", "const setActivatedNode = useSetAtom("
          ]))
          s = s.replace('import { activatedNodeAtom } from "@/stateV2/detectedNode";\\n', "")
          s = s.replace('import { modeAtom } from "@/stateV2/mode";\\n', "")
          s = s.replace('import { useSetAtom } from "jotai";\\n', "")
          s = s.replace('\\tconst setMode = useSetAtom(modeAtom);\\n', "")
          s = s.replace('\\tconst setActivatedNode = useSetAtom(activatedNodeAtom);\\n', "")
          s = s.replace('import { Suspense } from "react";', '''import { Suspense, useState } from "react";
          import { Modal, Input, Button, message } from "antd";
          import { randomUserId } from "@/faker/wechat/user";
          import { setAllProfilesValue } from "@/stateV2/profile";''')
          s = s.replace('''	const setActivatedNode = useSetAtom(activatedNodeAtom);

          	return (''', '''	const setActivatedNode = useSetAtom(activatedNodeAtom);
          	const [addVisible, setAddVisible] = useState(false);
          	const [nickname, setNickname] = useState("");
          	const [wechat, setWechat] = useState("");
          	const [avatar, setAvatar] = useState("");
          	const [avatarName, setAvatarName] = useState("选择头像");

          	const createContact = () => {
          		if (!nickname.trim() || !wechat.trim() || !avatar) {
          			message.warning("请填写昵称、微信号并上传头像");
          			return;
          		}
          		setAllProfilesValue((pv) => [...pv, {
          			id: randomUserId(),
          			nickname: nickname.trim(),
          			wechat: wechat.trim(),
          			avatarInfo: avatar,
          			momentsPrivacy: "all",
          			momentsBackgroundLike: false,
          			thumbnailInfo: [],
          			privacy: "all",
          		}]);
          		setAddVisible(false);
          		setNickname("");
          		setWechat("");
          		setAvatar("");
          		setAvatarName("选择头像");
          		message.success("联系人已添加");
          	};

          	return (''')
          s = s.replace('''						setMode("edit");
          						setActivatedNode("contacts-container");''', '''						setAddVisible(true);''')
          s = s.replace('''			<BottomNavbar />
          		</>''', '''			<BottomNavbar />
          			<Modal title="添加朋友" open={addVisible} onCancel={() => setAddVisible(false)} footer={null} centered>
          				<div className="flex flex-col gap-4 py-2">
          					<label className="flex items-center gap-3">
          						<img src={avatar || "https://cdn-fakeworld.azureedge.net/fakeworld/ppf3dl.jpg"} className="h-16 w-16 rounded-md object-cover" />
          						<span className="text-sm text-[#07c160]">
          							{avatarName}
          							<input type="file" accept="image/*" className="hidden" onChange={(e) => {
          								const file = e.target.files?.[0];
          								if (!file) return;
          								const reader = new FileReader();
          								reader.onload = () => { setAvatar(String(reader.result)); setAvatarName(file.name); };
          								reader.readAsDataURL(file);
          							}} />
          						</span>
          					</label>
          					<Input placeholder="请输入朋友昵称" value={nickname} onChange={(e) => setNickname(e.target.value)} />
          					<Input placeholder="请输入微信号" value={wechat} onChange={(e) => setWechat(e.target.value)} />
          					<Button type="primary" block onClick={createContact}>添加到通讯录</Button>
          				</div>
          			</Modal>
          		</>''')
          p.write_text(s)

          # 保留 Fake World 微信界面，移除默认演示联系人和聊天
          p = Path("packages/web/src/faker/wechat/user/consts.ts")
          s = p.read_text()
          start = s.index("export const INIT_FRIENDS:")
          s = s[:start] + "export const INIT_FRIENDS: TStateAllProfiles = [];\n"
          s = s.replace("nickname: \"林克\"", "nickname: \"我\"")
          s = s.replace("wechat: \"link\"", "wechat: \"my-wechat\"")
          s = s.replace("area: \"Hyrule\"", "area: \"\"")
          s = s.replace("signature: \"Master Sword!!!!\"", "signature: \"\"")
          p.write_text(s)

          p = Path("packages/web/src/stateV2/profile/core.ts")
          s = p.read_text().replace("\"allProfiles\"", "\"allProfiles-custom-v1\"")
          p.write_text(s)

          p = Path("packages/web/src/stateV2/dialogueList.ts")
          s = p.read_text()
          a = s.index("export const dialogueListAtom =")
          b = s.index("export const dialogueListEffect", a)
          s = s[:a] + "export const dialogueListAtom = atomWithStorage<TStateDialogueList>(\"dialogueList-custom-v1\", []);" + "\n\n" + s[b:]
          p.write_text(s)

          p = Path("packages/web/src/stateV2/conversation/consts.ts")
          s = p.read_text()
          a = s.index("export const MOCK_INIT_CONVERSATION_LIST:")
          s = s[:a] + "export const MOCK_INIT_CONVERSATION_LIST: TConversationItem[] = [];\n"
          p.write_text(s)

          p = Path("packages/web/src/stateV2/conversation/core.ts")
          s = p.read_text().replace(chr(96) + "conversationList-" + chr(36) + "{id}" + chr(96), chr(96) + "conversationList-custom-v1-" + chr(36) + "{id}" + chr(96))
          p.write_text(s)

          p = Path("packages/web/index.html")
          s = p.read_text().replace("<title>Fake World</title>", "<title>微信 · 小手机</title>\n    <style>html,body,#root{width:100%;height:100%;margin:0;overflow:hidden} .phone-return{position:fixed;z-index:99999;left:8px;top:8px;padding:7px 11px;border:0;border-radius:7px;background:#ffffffdf;color:#222;font:14px -apple-system,BlinkMacSystemFont,sans-serif;box-shadow:0 1px 5px #0002} @media(max-width:700px){.phone-return{top:calc(env(safe-area-inset-top) + 6px)}}</style>")
          s = s.replace('<div id="root"></div>', """<button class="phone-return" onclick="location.href='../'">‹ 返回小手机</button>\n    <div id="root"></div>""")
          p.write_text(s)
          PY

      - name: Install and build Fake World frontend
        working-directory: fake-world
        run: |
          pnpm install --filter @fake-world/web... --no-frozen-lockfile
          pnpm --filter @fake-world/web build

      - name: Assemble Pages site
        run: |
          mkdir -p phone/wechat
          cp -a fake-world/packages/web/dist/. phone/wechat/
          cp fake-world/LICENSE phone/wechat/LICENSE
          touch phone/.nojekyll

      - name: Configure Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Upload site
        uses: actions/upload-pages-artifact@v3
        with:
          path: phone

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
