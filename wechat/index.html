<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover"><meta name="theme-color" content="#ededed"><title>微信</title><style>
*{box-sizing:border-box}html,body{margin:0;height:100%;overflow:hidden;font-family:-apple-system,BlinkMacSystemFont,"PingFang SC",sans-serif;color:#111;background:#ededed}button,input,textarea{font:inherit}button{border:0;background:none}.app{height:100dvh;max-width:760px;margin:auto;display:flex;flex-direction:column;background:#fff}.safe{height:env(safe-area-inset-top);background:#ededed;flex:none}.head{height:54px;flex:none;background:#ededed;display:flex;align-items:center;justify-content:space-between;padding:0 16px;border-bottom:1px solid #ddd}.title{font-size:19px;font-weight:600}.actions{display:flex;gap:18px;position:relative;z-index:20}.actions button{font-size:27px;line-height:1;min-width:34px;min-height:40px;display:grid;place-items:center;touch-action:manipulation;pointer-events:auto;position:relative;z-index:21}.body{flex:1;overflow:auto;background:#fff}.nav{height:60px;flex:none;display:grid;grid-template-columns:repeat(4,1fr);background:#f8f8f8;border-top:1px solid #ddd;padding-bottom:env(safe-area-inset-bottom)}.nav button{display:flex;align-items:center;justify-content:center;flex-direction:column;gap:2px;font-size:11px;min-width:0}.nav svg{width:25px;height:25px;stroke:currentColor;fill:none;stroke-width:1.8}.nav .on{color:#07c160}.row{height:76px;display:flex;align-items:center;gap:12px;padding:0 14px;position:relative}.row:after{content:"";height:1px;background:#eee;position:absolute;bottom:0;left:86px;right:0}.avatar{width:54px;height:54px;border-radius:5px;object-fit:cover;background:#ddd;flex:none}.info{flex:1;min-width:0}.name{font-size:16px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.preview{font-size:13px;color:#999;margin-top:6px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.time{font-size:11px;color:#aaa;align-self:flex-start;padding-top:13px}.search{margin:9px 12px;background:#ededed;border-radius:5px;padding:8px;text-align:center;color:#999;font-size:13px}.label{background:#f6f6f6;padding:10px 16px;color:#888;font-size:13px}.contact{height:62px;display:flex;align-items:center;gap:12px;padding:0 16px;position:relative}.contact:after{content:"";position:absolute;bottom:0;left:66px;right:0;height:1px;background:#eee}.contact .avatar{width:38px;height:38px}.empty{text-align:center;color:#aaa;padding:55px 16px;line-height:2}.chathead{height:54px;background:#ededed;display:grid;grid-template-columns:48px 1fr 48px;align-items:center;padding:0 8px;border-bottom:1px solid #ddd;flex:none}.chathead b{font-size:18px;text-align:center;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.chathead button{font-size:25px;min-height:42px}.chatarea{flex:1;min-height:0;overflow:auto;background:#ededed;padding:14px 12px}.chatarea{height:calc(100% - 106px);overflow:auto;background:#ededed;padding:14px 12px}.msg{display:flex;width:100%;gap:10px;margin:14px 0;align-items:flex-start}.msg.mine{flex-direction:row-reverse}.msg .avatar{width:38px;height:38px}.msg>div{min-width:0;max-width:calc(100% - 50px)}.bubble{display:block;width:fit-content;min-width:48px;max-width:100%;padding:9px 12px;border-radius:5px;background:#fff;line-height:1.5;white-space:pre-wrap;word-break:break-word;overflow-wrap:anywhere;font-size:16px}.mine .bubble{background:#95ec69}.compose{height:64px;display:flex;gap:9px;align-items:center;padding:7px 12px;background:#f7f7f7;border-top:1px solid #ddd;flex:none}.compose input{flex:1;min-width:0;height:44px;border:0;padding:8px 12px;background:#fff;border-radius:6px;outline:none;font-size:16px}.compose .tool{font-size:23px;color:#333;padding:4px;flex:none}.send,.primary{background:#07c160;color:white;border-radius:5px;padding:9px 15px}.shade{position:absolute;inset:0;background:#0006;display:none;align-items:center;justify-content:center;padding:18px;z-index:9}.modal{background:white;border-radius:10px;width:min(430px,100%);padding:18px}.modal h3{margin:0 0 12px}.field{display:block;width:100%;padding:12px 8px;border:0;border-bottom:1px solid #eee;outline:none;margin:6px 0}.primary{width:100%;margin-top:12px;padding:12px}.upload{display:flex;gap:12px;align-items:center;margin:12px 0}.upload img{width:58px;height:58px;object-fit:cover;border-radius:5px}.mebox{display:flex;gap:14px;align-items:center;padding:24px 18px;margin-bottom:10px}.mebox .avatar{width:65px;height:65px}.discover{height:66px;display:flex;align-items:center;padding:0 18px;gap:16px;border-bottom:1px solid #eee}.discover b{font-size:22px;color:#576b95;width:28px}.post{padding:15px;border-bottom:1px solid #eee}.post img{max-width:75%;max-height:200px;display:block;margin-top:10px}.hidden{display:none!important}.senderbar{display:none}.senderbar select{flex:1;min-width:0;border:1px solid #ddd;border-radius:5px;background:#fff;padding:7px}.groupavatar{display:grid;grid-template-columns:repeat(2,1fr);gap:1px;width:54px;height:54px;border-radius:5px;overflow:hidden;background:#ddd;flex:none}.groupavatar img{width:26px;height:26px;object-fit:cover}
 .wx-red{background:#fa9d3b;color:white;padding:12px 16px;border-radius:8px;min-width:150px}.chat-image{max-width:180px;max-height:220px;border-radius:6px;display:block}.quote{border-top:1px solid #ddd;margin-top:7px;padding-top:6px;color:#777;font-size:12px}.emoji-grid{display:grid;grid-template-columns:repeat(6,1fr);gap:8px}.emoji-grid button{font-size:25px;padding:8px}.quick-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}.quick-grid button{background:#f5f5f5;border-radius:8px;padding:18px 4px;font-size:18px}.post{padding:16px;border-bottom:8px solid #f5f5f5}.post-author{display:flex;align-items:center;gap:9px}.post-author img{width:40px;height:40px;object-fit:cover;border-radius:5px}.post-text{margin:12px 0;white-space:pre-wrap}.post-images{display:grid;grid-template-columns:repeat(3, minmax(0,1fr));gap:5px}.post-images img{width:100%;aspect-ratio:1;object-fit:cover}.post-actions{display:flex;justify-content:flex-end;gap:18px;margin-top:10px}.post-actions button{background:#f5f5f5;padding:6px 12px;color:#576b95}.comments{background:#f6f6f6;padding:8px;font-size:13px;line-height:1.8}.bubble{overflow-wrap:anywhere}</style></head><body><main class="app"><div class="safe"></div><header class="head" id="head"><b class="title" id="title">微信</b><div class="actions"><button id="wxSearch" type="button">⌕</button><button id="wxAdd" type="button" aria-label="添加好友">＋</button></div></header><section class="body" id="body"></section><nav class="nav" id="nav"><button data-t="chat" class="on" onclick="go('chat')"><svg viewBox="0 0 24 24"><path d="M3 5.5A3.5 3.5 0 0 1 6.5 2h11A3.5 3.5 0 0 1 21 5.5v8a3.5 3.5 0 0 1-3.5 3.5H9l-5 4v-5.5A3.5 3.5 0 0 1 3 12z"/></svg>微信</button><button data-t="contacts" onclick="go('contacts')"><svg viewBox="0 0 24 24"><circle cx="9" cy="7" r="3.5"/><path d="M2.5 21v-2a6.5 6.5 0 0 1 13 0v2zM17 5h5M17 9h5"/></svg>通讯录</button><button data-t="discover" onclick="go('discover')"><svg viewBox="0 0 24 24"><path d="M12 2.5 14 9l7.5 3-7.5 3-2 6.5L10 15l-7.5-3L10 9z"/></svg>发现</button><button data-t="me" onclick="go('me')"><svg viewBox="0 0 24 24"><circle cx="12" cy="7" r="4"/><path d="M3 22a9 9 0 0 1 18 0"/></svg>我</button></nav><div class="shade" id="shade"><div class="modal" id="modal"></div></div></main>
<script>
const $=s=>document.querySelector(s),read=(k,d)=>{try{return JSON.parse(localStorage.getItem('wx_'+k))??d}catch{return d}},write=(k,v)=>localStorage.setItem('wx_'+k,JSON.stringify(v)),fallback='data:image/svg+xml,'+encodeURIComponent('<svg xmlns="http://www.w3.org/2000/svg" width="80" height="80"><rect width="100%" height="100%" fill="#dce8e2"/><circle cx="40" cy="29" r="15" fill="#a7c0b4"/><path d="M10 80Q15 48 40 48T70 80" fill="#a7c0b4"/></svg>'),safe=s=>String(s||'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
let people=read('people',[]),groups=read('groups',[]),messages=read('messages',{}),moments=read('moments',[]),me=read('me',{name:'我',avatar:''}),tab='chat',active=null,asSender='me';
function avatar(x){return x||fallback}function now(){return new Date().toLocaleTimeString('zh-CN',{hour:'2-digit',minute:'2-digit'})}
function go(t){tab=t;active=null;$('#head').classList.remove('hidden');$('#nav').classList.remove('hidden');$('#title').textContent=({chat:'微信',contacts:'通讯录',discover:'发现',me:'我'})[t];document.querySelectorAll('.nav button').forEach(b=>b.classList.toggle('on',b.dataset.t===t));render()}
function render(){
  const b = $('#body');
  b.innerHTML = '';
  if(tab === 'chat'){
    const list=[...people.map(p=>({...p,kind:'person'})),...groups.map(g=>({...g,kind:'group'}))].sort((x,y)=>(messages[y.id]?.at||0)-(messages[x.id]?.at||0));
    if(!list.length)b.innerHTML='<div class="empty">还没有聊天<br>点击右上角「＋」添加朋友或创建群聊</div>';
    list.forEach(p=>{const m=(messages[p.id]||[]).slice(-1)[0];const av=p.kind==='group'?'<div class="groupavatar">'+p.members.slice(0,4).map(id=>'<img src="'+avatar(people.find(x=>x.id===id)?.avatar)+'">').join('')+'</div>':'<img class="avatar" src="'+avatar(p.avatar)+'">';b.insertAdjacentHTML('beforeend','<div class="row" data-chat="'+safe(p.id)+'">'+av+'<div class="info"><div class="name">'+safe(p.remark||p.name)+'</div><div class="preview">'+(p.kind==='group'&&m?'<span>'+safe(m.senderName||'')+'：</span>':'')+safe(m?.text||'')+'</div></div><div class="time">'+safe(m?.time||'')+'</div></div>')});
    b.querySelectorAll('[data-chat]').forEach(el=>el.addEventListener('click',()=>chat(el.dataset.chat)));
  } else if(tab === 'contacts'){
    b.innerHTML = '<div class="search" id="contactSearch">⌕ 搜索</div>' +
      '<div class="contact" id="newFriend" role="button"><div class="avatar" style="background:#07c160;color:white;display:grid;place-items:center;font-size:25px">＋</div>新的朋友</div>' +
      '<div class="label">我的好友</div>';
    if(!people.length) b.insertAdjacentHTML('beforeend','<div class="empty">暂无联系人<br>点击「新的朋友」添加</div>');
    people.forEach(p => {
      b.insertAdjacentHTML('beforeend','<div class="contact" data-profile="' + safe(p.id) + '"><img class="avatar" src="' + avatar(p.avatar) + '">' + safe(p.name) + '</div>');
    });
    $('#newFriend').addEventListener('click', newPerson);
    $('#contactSearch').addEventListener('click', search);
    b.querySelectorAll('[data-profile]').forEach(el => el.addEventListener('click', () => profile(el.dataset.profile)));
  } else if(tab === 'discover'){
    b.innerHTML = '<div class="discover" id="momentsLink"><b>◎</b>朋友圈　<span style="margin-left:auto;color:#aaa">›</span></div>' +
      '<div class="discover"><b>⌁</b>视频号</div><div class="discover"><b>◇</b>扫一扫</div><div class="discover"><b>▤</b>小程序</div>';
    $('#momentsLink').addEventListener('click', showMoments);
  } else if(tab === 'me'){
    b.innerHTML = '<div class="mebox" id="editMe"><img class="avatar" src="' + avatar(me.avatar) + '">' +
      '<div class="info"><div class="name">' + safe(me.name) + '</div><div class="preview">微信号：mywechat</div></div>›</div>' +
      '<div class="discover">收藏</div><div class="discover" id="myMoments">朋友圈</div><div class="discover">设置</div>';
    $('#editMe').addEventListener('click', editMe);
    $('#myMoments').addEventListener('click', showMoments);
  }
}
function showModal(s){$('#modal').innerHTML=s;$('#shade').style.display='flex'}function close(){ $('#shade').style.display='none'}$('#shade').onclick=e=>{if(e.target.id==='shade')close()}
function addMenu(){newPerson()}
function imageInput(id,preview){$(id).onchange=e=>{let f=e.target.files[0];if(!f)return;let r=new FileReader();r.onload=()=>{let im=new Image();im.onload=()=>{let c=document.createElement('canvas'),z=Math.min(1,256/Math.max(im.width,im.height));c.width=Math.round(im.width*z);c.height=Math.round(im.height*z);c.getContext('2d').drawImage(im,0,0,c.width,c.height);$(preview).src=c.toDataURL('image/jpeg',.78)};im.src=r.result};r.readAsDataURL(f)}}
function newPerson(){showModal('<h3>添加朋友</h3><div class="upload"><img id="pv" src="'+fallback+'"><label style="color:#07c160">选择头像<input id="file" type="file" accept="image/*" hidden></label></div><input class="field" id="nm" placeholder="请输入昵称"><input class="field" id="wxid" placeholder="微信号（选填）"><button class="primary" id="savePersonBtn" type="button">添加到通讯录</button>');imageInput('#file','#pv');document.getElementById('savePersonBtn').onclick=savePerson}
function savePerson(){try{let n=$('#nm').value.trim();if(!n){alert('请填写昵称');$('#nm').focus();return}let a=$('#pv').src;let person={id:'p'+Date.now(),name:n,wx:$('#wxid').value.trim(),avatar:a===fallback?'':a};people.push(person);write('people',people);close();go('contacts')}catch(err){console.error(err);alert('保存失败，可能是头像图片太大。请重新选择较小的头像后再试。')}}
function getConversation(id){return groups.find(g=>g.id===id)||people.find(p=>p.id===id)}
function isGroup(id){return !!groups.find(g=>g.id===id)}
function chat(id){active=id;const p=getConversation(id);if(!p)return;asSender='me';$('#head').classList.add('hidden');$('#nav').classList.add('hidden');const title=p.remark||p.name;$('#body').innerHTML='<div class="chathead"><button id="backChat">‹</button><b>'+safe(title)+'</b><button id="chatMore">···</button></div><div class="chatarea" id="chatarea"></div><div class="compose"><button class="tool" id="voiceBtn">◉</button><input id="msg" placeholder=""><button class="tool" id="emojiBtn">☺</button><button class="tool" id="sendBtn">＋</button></div>';$('#backChat').onclick=()=>go('chat');$('#chatMore').onclick=chatOptions;$('#voiceBtn').onclick=()=>alert('语音输入为模拟按钮');$('#emojiBtn').onclick=()=>{const i=$('#msg');i.value+='😊';i.focus()};$('#sendBtn').onclick=()=>{if($('#msg').value.trim())send();else chatOptions()};buildSenderOptions();draw()}
function chatOptions(){showModal('<h3>聊天设置</h3><div style="padding:10px 0;color:#666">当前发送身份</div><select class="field" id="senderSelect"></select><button class="primary" id="saveSender">确定</button><button class="field" id="editRemark">设置备注</button>');buildSenderOptions();$('#saveSender').onclick=()=>{asSender=$('#senderSelect').value;close()};$('#editRemark').onclick=()=>{close();editRemark(active)}}
function editRemark(id){let p=people.find(x=>x.id===id);if(!p)return;showModal('<h3>设置备注</h3><input class="field" id="remarkInput" placeholder="备注名" value="'+safe(p.remark||'')+'"><button class="primary" id="saveRemark">保存</button>');$('#saveRemark').onclick=()=>{p.remark=$('#remarkInput').value.trim();write('people',people);close();chat(id)}}
function buildSenderOptions(){let p=getConversation(active),opts=[{id:'me',name:me.name||'我'}];if(isGroup(active)){p.members.forEach(id=>{let x=people.find(y=>y.id===id);if(x)opts.push({id:x.id,name:x.name})})}else opts.push({id:p.id,name:p.name});$('#senderSelect').innerHTML=opts.map(x=>'<option value="'+safe(x.id)+'">'+safe(x.name)+'</option>').join('');$('#senderSelect').value=asSender}
function draw(){let a=$('#chatarea'),p=getConversation(active);if(!a||!p)return;a.innerHTML=(messages[active]||[]).map(m=>{let sid=m.senderId||(m.mine?'me':p.id),mine=sid==='me',person=people.find(x=>x.id===sid),name=mine?(me.name||'我'):(person?.name||m.senderName||p.name),av=mine?me.avatar:person?.avatar;return '<div class="msg '+(mine?'mine':'')+'"><img class="avatar" src="'+avatar(av)+'"><div><div style="font-size:11px;color:#888;margin:0 4px 4px">'+(isGroup(active)?safe(name):'')+'</div><div class="bubble">'+safe(m.text)+'</div></div></div>'}).join('');a.scrollTop=a.scrollHeight}
function send(){let input=$('#msg'),v=input.value.trim();if(!v)return;let sid=asSender,p=getConversation(active),sender=sid==='me'?me:people.find(x=>x.id===sid);messages[active]=messages[active]||[];messages[active].push({text:v,senderId:sid,senderName:sender?.name||'我',time:now(),mine:sid==='me'});messages[active].at=Date.now();write('messages',messages);draw();input.value=''}
function createGroup(){if(people.length<2){alert('至少添加两位好友才能创建群聊');return}showModal('<h3>创建群聊</h3><input class="field" id="groupName" placeholder="群聊名称（选填）"><div style="max-height:45vh;overflow:auto">'+people.map(p=>'<label style="display:flex;align-items:center;gap:10px;padding:9px 2px;border-bottom:1px solid #eee"><input type="checkbox" class="groupMember" value="'+safe(p.id)+'"><img class="avatar" style="width:36px;height:36px" src="'+avatar(p.avatar)+'">'+safe(p.name)+'</label>').join('')+'</div><button class="primary" id="createGroupBtn">完成，创建群聊</button>');$('#createGroupBtn').onclick=saveGroup}
function saveGroup(){let members=[...document.querySelectorAll('.groupMember:checked')].map(x=>x.value);if(members.length<2){alert('请选择至少两位好友');return}let name=$('#groupName').value.trim()||members.map(id=>people.find(p=>p.id===id)?.name).join('、');let g={id:'g'+Date.now(),name,members,created:Date.now()};groups.push(g);write('groups',groups);messages[g.id]=[];write('messages',messages);close();go('chat')}
function groupInfo(id){let g=groups.find(x=>x.id===id);showModal('<h3>'+safe(g.name)+'</h3><p style="color:#888">群成员（'+g.members.length+'）</p>'+g.members.map(id=>{let p=people.find(x=>x.id===id);return p?'<div class="contact"><img class="avatar" src="'+avatar(p.avatar)+'">'+safe(p.name)+'</div>':''}).join('')+'<button class="primary" id="renameGroup">修改群名称</button>');$('#renameGroup').onclick=()=>{showModal('<h3>修改群名称</h3><input class="field" id="newGroupName" value="'+safe(g.name)+'"><button class="primary" id="saveGroupName">保存</button>');$('#saveGroupName').onclick=()=>{g.name=$('#newGroupName').value.trim()||g.name;write('groups',groups);close();chat(id)}}}
function plusMenu(){showModal('<h3>微信</h3><button class="field" id="menuAdd">添加朋友</button><button class="field" id="menuGroup">发起群聊</button>');$('#menuAdd').onclick=newPerson;$('#menuGroup').onclick=createGroup}
function profile(id){let p=people.find(x=>x.id===id);showModal(`<h3>朋友资料</h3><div class="upload"><img id="epv" src="${avatar(p.avatar)}"><label style="color:#07c160">修改头像<input id="efile" type="file" accept="image/*" hidden></label></div><input class="field" id="en" value="${safe(p.name)}" placeholder="昵称"><input class="field" id="er" value="${safe(p.remark||'')}" placeholder="备注名"><input class="field" id="ew" value="${safe(p.wx||'')}" placeholder="微信号"><button class="primary" onclick="saveProfile('${id}')">保存</button><button class="field" style="color:#d44" onclick="del('${id}')">删除联系人</button>`);imageInput('#efile','#epv')}
function saveProfile(id){let p=people.find(x=>x.id===id);p.name=$('#en').value.trim()||p.name;p.remark=$('#er').value.trim();p.wx=$('#ew').value;p.avatar=$('#epv').src;write('people',people);close();active===id?chat(id):render()}
function del(id){if(!confirm('确定删除联系人？'))return;people=people.filter(p=>p.id!==id);delete messages[id];write('people',people);write('messages',messages);close();go('contacts')}
function search(){showModal('<h3>搜索联系人</h3><input class="field" id="query" placeholder="输入昵称"><button class="primary" onclick="doSearch()">搜索</button>')}
function doSearch(){let q=$('#query').value;close();tab='contacts';$('#title').textContent='通讯录';$('#body').innerHTML=people.filter(p=>p.name.includes(q)).map(p=>`<div class="contact" onclick="profile('${p.id}')"><img class="avatar" src="${avatar(p.avatar)}">${safe(p.name)}</div>`).join('')||'<div class="empty">没有找到联系人</div>'}
function editMe(){showModal('<h3>个人资料</h3><div class="upload"><img id="mpv" src="'+avatar(me.avatar)+'"><label style="color:#07c160">修改头像<input id="mfile" type="file" accept="image/*" hidden></label></div><input class="field" id="mn" value="'+safe(me.name)+'" placeholder="昵称"><button class="primary" onclick="saveMe()">保存</button>');imageInput('#mfile','#mpv')}
function saveMe(){me={name:$('#mn').value.trim()||'我',avatar:$('#mpv').src};write('me',me);close();render()}
function showMoments(){ $('#head').classList.add('hidden');$('#nav').classList.add('hidden');$('#body').innerHTML='<div class="chathead"><button onclick="go(\'discover\')">‹</button><b>朋友圈</b><button onclick="newMoment()">＋</button></div><div id="posts"></div>';drawMoments()}
function drawMoments(){$('#posts').innerHTML=moments.map((m,i)=>{let imgs=m.images|| (m.image?[m.image]:[]),likes=m.likes||[],comments=m.comments||[];return '<div class="post"><div class="post-author"><img src="'+avatar(m.avatar||me.avatar)+'"><b>'+safe(m.name||me.name)+'</b></div><div class="post-text">'+safe(m.text)+'</div><div class="post-images">'+imgs.map(x=>'<img src="'+x+'">').join('')+'</div><div class="preview">'+safe(m.time||'')+'</div><div class="post-actions"><button data-like="'+i+'">♡ '+(likes.length?'已赞':'赞')+'</button><button data-comment="'+i+'">评论</button></div>'+(comments.length?'<div class="comments">'+comments.map(c=>'<div><b>'+safe(c.name)+'：</b>'+safe(c.text)+'</div>').join('')+'</div>':'')+'</div>'}).join('')||'<div class="empty">还没有朋友圈</div>';$('#posts').querySelectorAll('[data-like]').forEach(b=>b.onclick=()=>{let m=moments[+b.dataset.like];m.likes=m.likes||[];let ix=m.likes.indexOf(me.name);ix<0?m.likes.push(me.name):m.likes.splice(ix,1);write('moments',moments);drawMoments()});$('#posts').querySelectorAll('[data-comment]').forEach(b=>b.onclick=()=>commentMoment(+b.dataset.comment))}
function newMoment(){showModal('<h3>发表朋友圈</h3><textarea id="mt" class="field" rows="4" placeholder="这一刻的想法..."></textarea><div class="upload"><label style="color:#07c160">添加图片（可多选）<input id="mf" type="file" accept="image/*" multiple hidden></label><div id="momentPreviews"></div></div><button class="primary" id="publishMoment">发表</button>');window._momentImages=[];$('#mf').onchange=e=>{[...e.target.files].forEach(file=>{let r=new FileReader();r.onload=()=>{window._momentImages.push(r.result);$('#momentPreviews').innerHTML=window._momentImages.map(x=>'<img style="width:64px;height:64px;object-fit:cover;margin:4px" src="'+x+'">').join('')};r.readAsDataURL(file)};e.target.value=''};$('#publishMoment').onclick=saveMoment}
function saveMoment(){let t=$('#mt').value.trim(),imgs=window._momentImages||[];if(!t&&!imgs.length)return;moments.unshift({id:'m'+Date.now(),name:me.name,avatar:me.avatar,text:t,images:imgs,time:now(),likes:[],comments:[]});write('moments',moments);close();drawMoments()}
function commentMoment(i){let m=moments[i];showModal('<h3>评论</h3><input class="field" id="commentText" placeholder="写下评论"><button class="primary" id="sendComment">发送</button>');$('#sendComment').onclick=()=>{let t=$('#commentText').value.trim();if(t){m.comments=m.comments||[];m.comments.push({name:me.name,text:t});write('moments',moments)}close();drawMoments()}}

function emojiMenu(){let emojis='😀 😃 😄 😁 😆 😅 😂 🙂 🙃 😉 😊 😍 🥰 😘 😎 🤔 🥺 😭 😡 👍 👎 👏 🙌 ❤️ 💕 💖 🎉 🌹 ☀️ 🌙 🍀'.split(' ');showModal('<h3>选择表情</h3><div class="emoji-grid">'+emojis.map(x=>'<button>'+x+'</button>').join('')+'</div>');document.querySelectorAll('.emoji-grid button').forEach(b=>b.onclick=()=>{let i=$('#msg');i.value+=b.textContent;close();i.focus()})}
function quickMenu(){showModal('<h3>更多功能</h3><div class="quick-grid"><button id="qPhoto">▧<br>图片</button><button id="qRed">🧧<br>红包</button><button id="qTransfer">￥<br>转账</button><button id="qTime">◷<br>时间</button><button id="qQuote">❞<br>引用</button></div>');$('#qPhoto').onclick=()=>{showModal('<h3>发送图片</h3><input class="field" id="chatPhoto" type="file" accept="image/*"><button class="primary" id="sendPhoto">发送</button>');$('#sendPhoto').onclick=()=>{let file=$('#chatPhoto').files[0];if(!file)return;let r=new FileReader();r.onload=()=>{send({type:'image',src:r.result});close()};r.readAsDataURL(file)}};$('#qRed').onclick=()=>moneyMessage('redpacket');$('#qTransfer').onclick=()=>moneyMessage('transfer');$('#qTime').onclick=()=>{let t=prompt('输入要显示的时间','08:30');if(t){send({text:t});close()}};$('#qQuote').onclick=()=>{let t=prompt('输入要引用的消息');if(t){let i=$('#msg');i.value='';send({quote:t,text:'回复：'+t});close()}}}
function moneyMessage(type){let title=type==='redpacket'?'发送红包':'发起转账';showModal('<h3>'+title+'</h3><input class="field" id="moneyAmount" type="number" min="0.01" step="0.01" placeholder="金额（元）"><input class="field" id="moneyNote" placeholder="备注/祝福语"><button class="primary" id="confirmMoney">发送</button>');$('#confirmMoney').onclick=()=>{let amount=Number($('#moneyAmount').value);if(!amount||amount<=0){alert('请输入有效金额');return}send({type,amount:amount.toFixed(2),note:$('#moneyNote').value});close()}}
function messageMenu(i){let m=messages[active][i];showModal('<h3>消息操作</h3><button class="field" id="msgEdit">编辑</button><button class="field" id="msgQuote">引用回复</button><button class="field" id="msgRecall">撤回</button><button class="field" id="msgDelete">删除</button>');$('#msgEdit').onclick=()=>{let v=prompt('编辑消息',m.text||'');if(v!==null){m.text=v;write('messages',messages);close();draw()}};$('#msgQuote').onclick=()=>{let v=m.text||m.note||'消息';close();$('#msg').value='回复：'+v+' ';$('#msg').focus()};$('#msgRecall').onclick=()=>{m.type='text';m.text='你撤回了一条消息';m.amount='';m.note='';write('messages',messages);close();draw()};$('#msgDelete').onclick=()=>{messages[active].splice(i,1);write('messages',messages);close();draw()}}

render();
document.getElementById('wxAdd').addEventListener('click',e=>{e.preventDefault();e.stopPropagation();plusMenu()});
document.getElementById('wxSearch').addEventListener('click',e=>{e.preventDefault();e.stopPropagation();search()});
window.addFriend=newPerson;window.openWeChatAdd=newPerson;
</script></body></html>
