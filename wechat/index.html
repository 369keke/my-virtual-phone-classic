ot-selected .wx-money-card,.msg.shot-selected .chat-image{outline:none}</style></head><body><main class="app"><div class="safe"></div><header class="head" id="head"><b class="title" id="title">微信</b><div class="actions"><button id="wxSearch" type="button">⌕</button><button id="wxAdd" type="button" aria-label="添加好友">＋</button></div></header><section class="body" id="body"></section><nav class="nav" id="nav"><button data-t="chat" class="on" onclick="go('chat')"><svg viewBox="0 0 24 24"><path d="M3 5.5A3.5 3.5 0 0 1 6.5 2h11A3.5 3.5 0 0 1 21 5.5v8a3.5 3.5 0 0 1-3.5 3.5H9l-5 4v-5.5A3.5 3.5 0 0 1 3 12z"/></svg>微信</button><button data-t="contacts" onclick="go('contacts')"><svg viewBox="0 0 24 24"><circle cx="9" cy="7" r="3.5"/><path d="M2.5 21v-2a6.5 6.5 0 0 1 13 0v2zM17 5h5M17 9h5"/></svg>通讯录</button><button data-t="discover" onclick="go('discover')"><svg viewBox="0 0 24 24"><path d="M12 2.5 14 9l7.5 3-7.5 3-2 6.5L10 15l-7.5-3L10 9z"/></svg>发现</button><button data-t="me" onclick="go('me')"><svg viewBox="0 0 24 24"><circle cx="12" cy="7" r="4"/><path d="M3 22a9 9 0 0 1 18 0"/></svg>我</button></nav><div class="shade" id="shade"><div class="modal" id="modal"></div></div></main>
<script>
const $=s=>document.querySelector(s),read=(k,d)=>{try{return JSON.parse(localStorage.getItem('wx_'+k))??d}catch{return d}},write=(k,v)=>localStorage.setItem('wx_'+k,JSON.stringify(v)),fallback='data:image/svg+xml,'+encodeURIComponent('<svg xmlns="http://www.w3.org/2000/svg" width="80" height="80"><rect width="100%" height="100%" fill="#dce8e2"/><circle cx="40" cy="29" r="15" fill="#a7c0b4"/><path d="M10 80Q15 48 40 48T70 80" fill="#a7c0b4"/></svg>'),safe=s=>String(s||'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
let people=read('people',[]),groups=read('groups',[]),messages=read('messages',{}),moments=read('moments',[]),me=read('me',{name:'我',avatar:''}),tab='chat',active=null,asSender='me';
function avatar(x){return x||fallback}function now(){return new Date().toLocaleTimeString('zh-CN',{hour:'2-digit',minute:'2-digit'})}
function go(t){tab=t;active=null;$('#head').classList.remove('hidden');$('#nav').classList.remove('hidden');$('#title').textContent=({chat:'微信',contacts:'通讯录',discover:'发现',me:'我'})[t];document.querySelectorAll('.nav button').forEach(b=>b.classList.toggle('on',b.dataset.t===t));render()}
function render(){
  const b = $('#body');
  b.innerHTML = '';
  if(tab === 'chat'){
    const list=[...people.map(p=>({...p,kind:'person'})),...groups.map(g=>({...g,kind:'group'}))].sort((x,y)=>(messages[y.id]?.at||0)-(messages[x.id]?.at||0));
    if(!list.length)b.innerHTML='<div class="empty">还没有聊天<br>点击右上角「＋」添加朋友或创建群聊</div>';
    list.forEach(p=>{const m=(messages[p.id]||[]).slice(-1)[0];const av=p.kind==='group'?'<div class="groupavatar">'+p.members.slice(0,4).map(id=>'<img src="'+avatar(people.find(x=>x.id===id)?.avatar)+'">').join('')+'</div>':'<img class="avatar" src="'+avatar(p.avatar)+'">';b.insertAdjacentHTML('beforeend','<div class="row" data-chat="'+safe(p.id)+'">'+av+'<div class="info"><div class="name">'+safe(p.remark||p.name)+'</div><div class="preview">'+(p.kind==='group'&&m?'<span>'+safe(m.senderName||'')+'：</span>':'')+safe(m?.text||'')+'</div></div><div class="time">'+safe(m?.time||'')+'</div></div>')});
    b.querySelectorAll('[data-chat]').forEach(el=>el.addEventListener('click',()=>chat(el.dataset.chat)));
  } else if(tab === 'contacts'){
    b.innerHTML = '<div class="search" id="contactSearch">⌕ 搜索</div>' +
      '<div class="contact" id="newFriend" role="button"><div class="avatar" style="background:#07c160;color:white;display:grid;place-items:center;font-size:25px">＋</div>新的朋友</div>' +
      '<div class="label">我的好友</div>';
    if(!people.length) b.insertAdjacentHTML('beforeend','<div class="empty">暂无联系人<br>点击「新的朋友」添加</div>');
    people.forEach(p => {
      b.insertAdjacentHTML('beforeend','<div class="contact" data-profile="' + safe(p.id) + '"><img class="avatar" src="' + avatar(p.avatar) + '">' + safe(p.name) + '</div>');
    });
    $('#newFriend').addEventListener('click', newPerson);
    $('#contactSearch').addEventListener('click', search);
    b.querySelectorAll('[data-profile]').forEach(el => el.addEventListener('click', () => profile(el.dataset.profile)));
  } else if(tab === 'discover'){
    b.innerHTML = '<div class="discover" id="momentsLink"><b>◎</b>朋友圈　<span style="margin-left:auto;color:#aaa">›</span></div>' +
      '<div class="discover"><b>⌁</b>视频号</div><div class="discover"><b>◇</b>扫一扫</div><div class="discover"><b>▤</b>小程序</div>';
    $('#momentsLink').addEventListener('click', showMoments);
  } else if(tab === 'me'){
    b.innerHTML = '<div class="mebox" id="editMe"><img class="avatar" src="' + avatar(me.avatar) + '">' +
      '<div class="info"><div class="name">' + safe(me.name) + '</div><div class="preview">微信号：mywechat</div></div>›</div>' +
      '<div class="discover">收藏</div><div class="discover" id="myMoments">朋友圈</div><div class="discover">设置</div>';
    $('#editMe').addEventListener('click', editMe);
    $('#myMoments').addEventListener('click', showMoments);
  }
}
function showModal(s){$('#modal').innerHTML=s;$('#shade').style.display='flex'}function close(){ $('#shade').style.display='none'}$('#shade').onclick=e=>{if(e.target.id==='shade')close()}
function addMenu(){newPerson()}
function imageInput(id,preview){$(id).onchange=e=>{let f=e.target.files[0];if(!f)return;let r=new FileReader();r.onload=()=>{let im=new Image();im.onload=()=>{let c=document.createElement('canvas'),z=Math.min(1,256/Math.max(im.width,im.height));c.width=Math.round(im.width*z);c.height=Math.round(im.height*z);c.getContext('2d').drawImage(im,0,0,c.width,c.height);$(preview).src=c.toDataURL('image/jpeg',.78)};im.src=r.result};r.readAsDataURL(f)}}
function newPerson(){showModal('<h3>添加朋友</h3><div class="upload"><img id="pv" src="'+fallback+'"><label style="color:#07c160">选择头像<input id="file" type="file" accept="image/*" hidden></label></div><input class="field" id="nm" placeholder="请输入昵称"><input class="field" id="wxid" placeholder="微信号（选填）"><button class="primary" id="savePersonBtn" type="button">添加到通讯录</button>');imageInput('#file','#pv');document.getElementById('savePersonBtn').onclick=savePerson}
function savePerson(){try{let n=$('#nm').value.trim();if(!n){alert('请填写昵称');$('#nm').focus();return}let a=$('#pv').src;let person={id:'p'+Date.now(),name:n,wx:$('#wxid').value.trim(),avatar:a===fallback?'':a};people.push(person);write('people',people);close();go('contacts')}catch(err){console.error(err);alert('保存失败，可能是头像图片太大。请重新选择较小的头像后再试。')}}
function getConversation(id){return groups.find(g=>g.id===id)||people.find(p=>p.id===id)}
function isGroup(id){return !!groups.find(g=>g.id===id)}
function chat(id){active=id;messages=read('messages',messages)||{};messages[active]=Array.isArray(messages[active])?messages[active]:[];const p=getConversation(id);if(!p)return;asSender='me';$('#head').classList.add('hidden');$('#nav').classList.add('hidden');$('#body').style.cssText='display:flex;flex-direction:column;min-height:0;overflow:hidden;';const title=p.remark||p.name;$('#body').innerHTML='<div class="chathead"><button id="backChat">‹</button><b>'+safe(title)+'</b><button id="chatMore">···</button></div><div class="chatarea" id="chatarea"></div><div class="compose"><button class="tool" id="voiceBtn">◉</button><input id="msg" placeholder=""><button class="tool" id="emojiBtn" type="button">☺</button><button class="tool" id="plusBtn" type="button">＋</button><button class="send" id="sendBtn" type="button">发送</button></div>';$('#backChat').onclick=()=>go('chat');$('#chatMore').onclick=chatOptions;$('#voiceBtn').onclick=()=>alert('语音输入为模拟按钮');$('#emojiBtn').onclick=emojiMenu;$('#plusBtn').onclick=quickMenu;$('#sendBtn').onclick=()=>{if($('#msg').value.trim())send();else $('#msg').focus()};$('#msg').onkeydown=e=>{if(e.key==='Enter'){e.preventDefault();if($('#msg').value.trim())send()}};buildSenderOptions();draw()}
function chatOptions(){showModal('<h3>聊天设置</h3><div style="padding:10px 0;color:#666">当前发送身份</div><select class="field" id="senderSelect"></select><button class="primary" id="saveSender">确定</button><button class="field" id="editRemark">设置备注</button>');buildSenderOptions();$('#saveSender').onclick=()=>{asSender=$('#senderSelect').value;close()};$('#editRemark').onclick=()=>{close();editRemark(active)}}
function editRemark(id){let p=people.find(x=>x.id===id);if(!p)return;showModal('<h3>设置备注</h3><input class="field" id="remarkInput" placeholder="备注名" value="'+safe(p.remark||'')+'"><button class="primary" id="saveRemark">保存</button>');$('#saveRemark').onclick=()=>{p.remark=$('#remarkInput').value.trim();write('people',people);close();chat(id)}}
function buildSenderOptions(){let p=getConversation(active),opts=[{id:'me',name:me.name||'我'}];if(isGroup(active)){p.members.forEach(id=>{let x=people.find(y=>y.id===id);if(x)opts.push({id:x.id,name:x.name})})}else opts.push({id:p.id,name:p.name});$('#senderSelect').innerHTML=opts.map(x=>'<option value="'+safe(x.id)+'">'+safe(x.name)+'</option>').join('');$('#senderSelect').value=asSender}

let wxShotMode=false,wxShotSelected=new Set();
function startShotMode(index){wxShotMode=true;wxShotSelected.clear();wxShotSelected.add(index);const area=$('#chatarea');if(!$('#shotBar'))area.insertAdjacentHTML('afterend','<div id="shotBar" class="shot-bar"><span id="shotCount">已选择 1 条消息</span><button id="shotPreviewBtn" type="button">生成截图</button><button id="shotCancelBtn" type="button">取消</button></div>');$('#shotPreviewBtn').onclick=previewChatShot;$('#shotCancelBtn').onclick=stopShotMode;refreshShotSelection()}

function previewChatShot(){const p=getConversation(active),all=messages[active]||[],arr=[...wxShotSelected].sort((a,b)=>a-b).map(i=>({m:all[i],i})).filter(x=>x.m);if(!arr.length){alert('请先长按一条消息，再选择要截图的消息');return}showModal('<h3>聊天截图预览（'+arr.length+'条）</h3><div id="shotPreview" class="shot-preview"><div class="shot-title">'+safe(p?.remark||p?.name||'聊天记录')+'</div>'+arr.map(({m})=>{let sid=m.senderId||(m.mine?'me':active),mine=sid==='me',who=mine?me:people.find(x=>x.id===sid)||{name:m.senderName||p.name,avatar:''};let card=m.type==='redpacket'?'<div class="shot-money">🧧 '+safe(m.note||m.text||'恭喜发财，大吉大利')+'</div>':m.type==='transfer'?'<div class="shot-money">⇄ ¥'+(Number(m.amount)||0).toFixed(2)+'<small>'+safe(m.note||'请收款')+'</small></div>':m.type==='image'?'<img class="shot-img" src="'+safe(m.src)+'">':safe(m.text||'');return '<div class="shot-row '+(mine?'mine':'')+'"><img src="'+avatar(who.avatar)+'"><div class="shot-person"><small>'+safe(who.name||'我')+'</small><div class="shot-bubble">'+card+'</div></div></div>'}).join('')+'</div><button class="primary" id="saveChatShot">保存截图图片</button>');$('#saveChatShot').onclick=()=>exportChatShot(arr,p)}
async function exportChatShot(arr,p){const scale=2,w=760,pad=28,rowGap=22;let canvas=document.createElement('canvas'),ctx=canvas.getContext('2d');let prepared=[];for(const {m} of arr){let sid=m.senderId||(m.mine?'me':active),mine=sid==='me',who=mine?me:people.find(x=>x.id===sid)||{name:m.senderName||p.name,avatar:''};let avatarImg=await shotLoadImage(avatar(who.avatar));let msgText=m.type==='redpacket'?'🧧 '+(m.note||m.text||'恭喜发财，大吉大利'):m.type==='transfer'?'⇄ ¥'+(Number(m.amount)||0).toFixed(2)+'  '+(m.note||'请收款'):m.type==='image'?'[图片]':(m.text||'');let lines=shotWrap(ctx,msgText,500,24);prepared.push({m,mine,who,avatarImg,lines,height:Math.max(66,lines.length*30+28)})}let total=100+prepared.reduce((n,x)=>n+x.height+rowGap,0);canvas.width=w*scale;canvas.height=total*scale;ctx.scale(scale,scale);ctx.fillStyle='#ededed';ctx.fillRect(0,0,w,total);ctx.fillStyle='#222';ctx.font='bold 25px sans-serif';ctx.fillText(p?.remark||p?.name||'聊天记录',pad,42);ctx.fillStyle='#999';ctx.font='14px sans-serif';ctx.fillText(new Date().toLocaleString('zh-CN'),pad,68);let y=94;for(const x of prepared){const avX=x.mine?w-pad-48:pad;shotRound(ctx,avX,y,48,48,7);if(x.avatarImg)ctx.drawImage(x.avatarImg,avX,y,48,48);else{ctx.fillStyle='#cbd8d1';ctx.fill()}const bubbleW=Math.min(530,Math.max(160,...x.lines.map(t=>ctx.measureText(t).width+28)));const bx=x.mine?avX-bubbleW-14:avX+62;const bh=x.height;ctx.fillStyle=x.mine?'#95ec69':'#fff';shotRound(ctx,bx,y,bubbleW,bh,8);ctx.fill();ctx.fillStyle='#222';ctx.font='22px sans-serif';x.lines.forEach((line,j)=>ctx.fillText(line,bx+14,y+31+j*30));ctx.fillStyle='#999';ctx.font='12px sans-serif';ctx.fillText(x.who.name||'',bx,y+bh+15);y+=bh+rowGap+16}const blob=await new Promise(resolve=>canvas.toBlob(resolve,'image/png'));if(!blob){alert('截图生成失败');return}const url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download='微信聊天截图.png';a.click();setTimeout(()=>URL.revokeObjectURL(url),30000);close();stopShotMode();alert('截图已生成。手机浏览器会将图 function shotWrap(ctx,text,maxWidth,fontSize){ctx.font=fontSize+'px sans-serif';let words=Array.from(String(text)),lines=[],line='';for(const ch of words){if(line&&ctx.measureText(line+ch).width>maxWidth){lines.push(line);line=ch}else line+=ch}if(line)lines.push(line);return lines.length?lines:['']}
function shotRound(ctx,x,y,w,h,r){ctx.beginPath();ctx.moveTo(x+r,y);ctx.arcTo(x+w,y,x+w,y+h,r);ctx.arcTo(x+w,y+h,x,y+h,r);ctx.arcTo(x,y+h,x,y,r);ctx.arcTo(x,y,x+w,y,r);ctx.closePath()}

function quickMenu(){showModal('<h3>更多功能</h3><div class="quick-grid"><button id="qPhoto">▧<br>图片</button><button id="qRed">🧧<br>红包</button><button id="qTransfer">￥<br>转账</button><button id="qTime">◷<br>时间</button><button id="qQuote">❞<br>引用</button></div>');$('#qPhoto').onclick=()=>{showModal('<h3>发送图片</h3><input class="field" id="chatPhoto" type="file" accept="image/*"><button class="primary" id="sendPhoto">发送</button>');$('#sendPhoto').onclick=()=>{let file=$('#chatPhoto').files[0];if(!file)return;let r=new FileReader();r.onload=()=>{send({type:'image',src:r.result});close()};r.readAsDataURL(file)}};$('#qRed').onclick=()=>moneyMessage('redpacket');$('#qTransfer').onclick=()=>moneyMessage('transfer');$('#qTime').onclick=()=>{let t=prompt('输入要显示的时间','08:30');if(t){send({text:t});close()}};$('#qQuote').onclick=()=>{let t=prompt('输入要引用的消息');if(t){let i=$('#msg');i.value='';send({quote:t,text:'回复：'+t});close()}}}
function moneyMessage(type){let title=type==='redpacket'?'发送红包':'发起转账';showModal('<h3>'+title+'</h3><input class="field" id="moneyAmount" type="number" min="0.01" step="0.01" placeholder="金额（元）"><input class="field" id="moneyNote" placeholder="备注/祝福语"><button class="primary" id="confirmMoney">发送</button>');$('#confirmMoney').onclick=()=>{let amount=Number($('#moneyAmount').value);if(!amount||amount<=0){alert('请输入有效金额');return}send({type,amount:amount.toFixed(2),note:$('#moneyNote').value});close()}}
function messageMenu(i){let m=messages[active]?.[i];if(!m)return;const menuItems=[['引用','↩','quote'],['删除','▤','delete'],['多选','☷','multi'],['复制','▢','copy']];showModal('<div class="wechat-context-menu">'+menuItems.map(([label,icon,key])=>'<button data-action="'+key+'"><span>'+icon+'</span>'+label+'</button>').join('')+'</div>');$('#modal').classList.add('context-modal');$('#modal').querySelectorAll('[data-action]').forEach(b=>b.onclick=()=>{let action=b.dataset.action;close();$('#modal').classList.remove('context-modal');if(action==='quote'){let sid=m.senderId||(m.mine?'me':active),who=sid==='me'?me:people.find(x=>x.id===sid)||{name:m.senderName||getConversation(active)?.name};pendingQuote={text:m.text||m.note||(m.type==='image'?'[图片]':m.type==='redpacket'?'[红包]':m.type==='transfer'?'[转账]':'[消息]'),name:who?.name||'对方'};showQuoteComposer();$('#msg').focus()}else if(action==='delete'){if(confirm('确定删除这条消息吗？')){messages[active].splice(i,1);write('messages',messages);draw()}}else if(action==='multi'){startShotMode(i)}else if(action==='copy'){navigator.clipboard?.writeText(m.text||'').catch(()=>{});alert('已复制')}})}
function showQuoteComposer(){let old=$('#quoteComposer');if(old)old.remove();const box=document.createElement('div');box.id='quoteComposer';box.className='quote-composer';box.innerHTML='<div><b>'+safe(pendingQuote.name)+'</b><span>'+safe(pendingQuote.text)+'</span></div><button type="button" aria-label="取消引用">×</button>';const compose=$('.compose');compose.before(box);box.querySelector('button').onclick=()=>{pendingQuote=null;box.remove()}}

render();
document.getElementById('wxAdd').addEventListener('click',e=>{e.preventDefault();e.stopPropagation();plusMenu()});
document.getElementById('wxSearch').addEventListener('click',e=>{e.preventDefault();e.stopPropagation();search()});
window.addFriend=newPerson;window.openWeChatAdd=newPerson;
</script></body></html>
