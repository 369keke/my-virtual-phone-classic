function startShotMode(index){wxShotMode=true;wxShotSelected.clear();wxShotSelected.add(index);const area=$('#chatarea');if(!$('#shotBar'))area.insertAdjacentHTML('afterend','<div id="shotBar" class="shot-bar"><span id="shotCount">已选择 1 条消息</span><button id="shotPreviewBtn" type="button">生成截图</button><button id="shotCancelBtn" type="button">取消</button></div>');$('#shotPreviewBtn').onclick=previewChatShot;$('#shotCancelBtn').onclick=stopShotMode;refreshShotSelection()}

function previewChatShot(){const p=getConversation(active),all=messages[active]||[],arr=[...wxShotSelected].sort((a,b)=>a-b).map(i=>({m:all[i],i})).filter(x=>x.m);if(!arr.length){alert('请先长按一条消息，再选择要截图的消息');return}showModal('<h3>聊天截图预览（'+arr.length+'条）</h3><div id="shotPreview" class="shot-preview"><div class="shot-title">'+safe(p?.remark||p?.name||'聊天记录')+'</div>'+arr.map(({m})=>{let sid=m.senderId||(m.mine?'me':active),mine=sid==='me',who=mine?me:people.find(x=>x.id===sid)||{name:m.senderName||p.name,avatar:''};let card=m.type==='redpacket'?'<div class="shot-money">🧧 '+safe(m.note||m.text||'恭喜发财，大吉大利')+'</div>':m.type==='transfer'?'<div class="shot-money">⇄ ¥'+(Number(m.amount)||0).toFixed(2)+'<small>'+safe(m.note||'请收款')+'</small></div>':m.type==='image'?'<img class="shot-img" src="'+safe(m.src)+'">':safe(m.text||'');return '<div class="shot-row '+(mine?'mine':'')+'"><img src="'+avatar(who.avatar)+'"><div class="shot-person"><small>'+safe(who.name||'我')+'</small><div class="shot-bubble">'+card+'</div></div></div>'}).join('')+'</div><button class="primary" id="saveChatShot">保存截图图片</button>');$('#saveChatShot').onclick=()=>exportChatShot(arr,p)}
async function exportChatShot(arr,p){const scale=2,w=760,pad=28,rowGap=22;let canvas=document.createElement('canvas'),ctx=canvas.getContext('2d');let prepared=[];for(const {m} of arr){let sid=m.senderId||(m.mine?'me':active),mine=sid==='me',who=mine?me:people.find(x=>x.id===sid)||{name:m.senderName||p.name,avatar:''};let avatarImg=await shotLoadImage(avatar(who.avatar));let msgText=m.type==='redpacket'?'🧧 '+(m.note||m.text||'恭喜发财，大吉大利'):m.type==='transfer'?'⇄ ¥'+(Number(m.amount)||0).toFixed(2)+'  '+(m.note||'请收款'):m.type==='image'?'[图片]':(m.text||'');let lines=shotWrap(ctx,msgText,500,24);prepared.push({m,mine,who,avatarImg,lines,height:Math.max(66,lines.length*30+28)})}let total=100+prepared.reduce((n,x)=>n+x.height+rowGap,0);canvas.width=w*scale;canvas.height=total*scale;ctx.scale(scale,scale);ctx.fillStyle='#ededed';ctx.fillRect(0,0,w,total);ctx.fillStyle='#222';ctx.font='bold 25px sans-serif';ctx.fillText(p?.remark||p?.name||'聊天记录',pad,42);ctx.fillStyle='#999';ctx.font='14px sans-serif';ctx.fillText(new Date().toLocaleString('zh-CN'),pad,68);let y=94;for(const x of prepared){const avX=x.mine?w-pad-48:pad;shotRound(ctx,avX,y,48,48,7);if(x.avatarImg)ctx.drawImage(x.avatarImg,avX,y,48,48);else{ctx.fillStyle='#cbd8d1';ctx.fill()}const bubbleW=Math.min(530,Math.max(160,...x.lines.map(t=>ctx.measureText(t).width+28)));const bx=x.mine?avX-bubbleW-14:avX+62;const bh=x.height;ctx.fillStyle=x.mine?'#95ec69':'#fff';shotRound(ctx,bx,y,bubbleW,bh,8);ctx.fill();ctx.fillStyle='#222';ctx.font='22px sans-serif';x.lines.forEach((line,j)=>ctx.fillText(line,bx+14,y+31+j*30));ctx.fillStyle='#999';ctx.font='12px sans-serif';ctx.fillText(x.who.name||'',bx,y+bh+15);y+=bh+rowGap+16}const blob=await new Promise(resolve=>canvas.toBlob(resolve,'image/png'));if(!blob){alert('截图生成失败');return}const url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download='微信聊天截图.png';a.click();setTimeout(()=>URL.revokeObjectURL(url),30000);close();stopShotMode();alert('截图已生成。手机浏览器会将图片保存到下载内容；如需放入相册，请在系统分享/下载界面选择保存到照片。')}
function shotWrap(ctx,text,maxWidth,fontSize){ctx.font=fontSize+'px sans-serif';let words=Array.from(String(text)),lines=[],line='';for(const ch of words){if(line&&ctx.measureText(line+ch).width>maxWidth){lines.push(line);line=ch}else line+=ch}if(line)lines.push(line);return lines.length?lines:['']}
function shotRound(ctx,x,y,w,h,r){ctx.beginPath();ctx.moveTo(x+r,y);ctx.arcTo(x+w,y,x+w,y+h,r);ctx.arcTo(x+w,y+h,x,y+h,r);ctx.arcTo(x,y+h,x,y,r);ctx.arcTo(x,y,x+w,y,r);ctx.closePath()}
function shotLoadImage(src){return new Promise(resolve=>{if(!src||!src.startsWith('data:'))return resolve(null);let im=new Image();im.onload=()=>resolve(im);im.onerror=()=>resolve(null);im.src=src})}
let pendingQuote=null;function syncComposer(){const input=$('#msg'),sendButton=$('#sendBtn'),plus=$('#plusBtn'),mic=$('#inputMic');if(!input||!sendButton||!plus||!mic)return;const hasText=!!input.value.trim();sendButton.classList.toggle('hidden',!hasText);plus.classList.toggle('hidden',hasText);mic.classList.toggle('hidden',hasText)}
function send(extra={}){let input=$('#msg'),v=input.value.trim();if(!v&&!extra.type)return;let sid=asSender,p=getConversation(active),sender=sid==='me'?me:people.find(x=>x.id===sid);messages[active]=messages[active]||[];messages[active].push({id:'wxm'+Date.now().toString(36)+Math.random().toString(36).slice(2,7),text:v,senderId:sid,senderName:sender?.name||'我',time:now(),createdAt:Date.now(),mine:sid==='me',...(pendingQuote?{quote:pendingQuote.text,quoteName:pendingQuote.name,quoteId:pendingQuote.id}:{}),...extra});pendingQuote=null;$('#quoteComposer')?.remove();messages[active].at=Date.now();write('messages',messages);draw();input.value='';syncComposer()}

function quickMenu(){showModal('<h3>更多功能</h3><div class="quick-grid"><button id="qPhoto">▧<br>图片</button><button id="qRed">🧧<br>红包</button><button id="qTransfer">￥<br>转账</button><button id="qTime">◷<br>时间</button><button id="qQuote">❞<br>引用</button></div>');$('#qPhoto').onclick=()=>{showModal('<h3>发送图片</h3><input class="field" id="chatPhoto" type="file" accept="image/*"><button class="primary" id="sendPhoto">发送</button>');$('#sendPhoto').onclick=()=>{let file=$('#chatPhoto').files[0];if(!file)return;let r=new FileReader();r.onload=()=>{send({type:'image',src:r.result});close()};r.readAsDataURL(file)}};$('#qRed').onclick=()=>moneyMessage('redpacket');$('#qTransfer').onclick=()=>moneyMessage('transfer');$('#qTime').onclick=()=>{let t=prompt('输入要显示的时间','08:30');if(t){send({text:t});close()}};$('#qQuote').onclick=()=>{let t=prompt('输入要引用的消息');if(t){let i=$('#msg');i.value='';send({quote:t,text:'回复：'+t});close()}}}
function moneyMessage(type){let title=type==='redpacket'?'发送红包':'发起转账';showModal('<h3>'+title+'</h3><input class="field" id="moneyAmount" type="number" min="0.01" step="0.01" placeholder="金额（元）"><input class="field" id="moneyNote" placeholder="备注/祝福语"><button class="primary" id="confirmMoney">发送</button>');$('#confirmMoney').onclick=()=>{let amount=Number($('#moneyAmount').value);if(!amount||amount<=0){alert('请输入有效金额');return}send({type,amount:amount.toFixed(2),note:$('#moneyNote').value});close()}}
function quoteMessageText(m){if(!m)return '[消息]';if(m.text)return String(m.text);if(m.type==='image')return '[图片]';if(m.type==='redpacket')return '[红包] '+(m.note||'恭喜发财，大吉大利');if(m.type==='transfer')return '[转账] ¥'+(Number(m.amount)||0).toFixed(2);if(m.type==='voice')return '[语音]';return '[消息]'}
function messageMenu(i){let m=messages[active]?.[i];if(!m)return;if(!m.id){m.id='wxm'+Date.now().toString(36)+Math.random().toString(36).slice(2,7);write('messages',messages)}const menuItems=[['引用','↩','quote'],['删除','▤','delete'],['多选','☷','multi'],['复制','▢','copy']];showModal('<div class="wechat-context-menu">'+menuItems.map(([label,icon,key])=>'<button data-action="'+key+'"><span>'+icon+'</span>'+label+'</button>').join('')+'</div>');$('#modal').classList.add('context-modal');$('#modal').querySelectorAll('[data-action]').forEach(b=>b.onclick=()=>{let action=b.dataset.action;close();$('#modal').classList.remove('context-modal');if(action==='quote'){let sid=m.senderId||(m.mine?'me':active),who=sid==='me'?me:people.find(x=>x.id===sid)||{name:m.senderName||getConversation(active)?.name};pendingQuote={id:m.id,text:quoteMessageText(m),name:who?.name||'对方'};showQuoteComposer();$('#msg').focus()}else if(action==='delete'){if(confirm('确定删除这条消息吗？')){messages[active].splice(i,1);write('messages',messages);draw()}}else if(action==='multi'){startShotMode(i)}else if(action==='copy'){navigator.clipboard?.writeText(m.text||'').catch(()=>{});alert('已复制')}})}
function showQuoteComposer(){let old=$('#quoteComposer');if(old)old.remove();const box=document.createElement('div');box.id='quoteComposer';box.className='quote-composer';box.innerHTML='<div><b>'+safe(pendingQuote.name)+'：</b><span>'+safe(pendingQuote.text)+'</span></div><button type="button" aria-label="取消引用">×</button>';const compose=$('.compose');compose.before(box);box.querySelector('button').onclick=()=>{pendingQuote=null;box.remove()}}

render();

document.getElementById('wxSearch').addEventListener('click',e=>{e.preventDefault();e.stopPropagation();search()});
