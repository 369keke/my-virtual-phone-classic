<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover"><meta name="theme-color" content="#ededed"><title>微信</title><style>
*{box-sizing:border-box}html,body{margin:0;height:100%;overflow:hidden;font-family:-apple-system,BlinkMacSystemFont,"PingFang SC",sans-serif;color:#111;background:#ededed}button,input,textarea{font:inherit}button{border:0;background:none}.app{height:100dvh;max-width:760px;margin:auto;display:flex;flex-direction:column;background:#fff}.safe{height:env(safe-area-inset-top);background:#ededed;flex:none}.head{height:54px;flex:none;background:#ededed;display:flex;align-items:center;justify-content:space-between;padding:0 16px;border-bottom:1px solid #ddd}.title{font-size:19px;font-weight:600}.actions{display:flex;gap:18px}.actions button{font-size:27px;line-height:1}.body{flex:1;overflow:auto;background:#fff}.nav{height:60px;flex:none;display:grid;grid-template-columns:repeat(4,1fr);background:#f8f8f8;border-top:1px solid #ddd;padding-bottom:env(safe-area-inset-bottom)}.nav button{display:flex;align-items:center;justify-content:center;flex-direction:column;gap:2px;font-size:11px;min-width:0}.nav svg{width:25px;height:25px;stroke:currentColor;fill:none;stroke-width:1.8}.nav .on{color:#07c160}.row{height:76px;display:flex;align-items:center;gap:12px;padding:0 14px;position:relative}.row:after{content:"";height:1px;background:#eee;position:absolute;bottom:0;left:86px;right:0}.avatar{width:54px;height:54px;border-radius:5px;object-fit:cover;background:#ddd;flex:none}.info{flex:1;min-width:0}.name{font-size:16px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.preview{font-size:13px;color:#999;margin-top:6px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.time{font-size:11px;color:#aaa;align-self:flex-start;padding-top:13px}.search{margin:9px 12px;background:#ededed;border-radius:5px;padding:8px;text-align:center;color:#999;font-size:13px}.label{background:#f6f6f6;padding:10px 16px;color:#888;font-size:13px}.contact{height:62px;display:flex;align-items:center;gap:12px;padding:0 16px;position:relative}.contact:after{content:"";position:absolute;bottom:0;left:66px;right:0;height:1px;background:#eee}.contact .avatar{width:38px;height:38px}.empty{text-align:center;color:#aaa;padding:55px 16px;line-height:2}.chathead{height:50px;background:#ededed;display:flex;align-items:center;justify-content:space-between;padding:0 12px;border-bottom:1px solid #ddd}.chatarea{height:calc(100% - 106px);overflow:auto;background:#ededed;padding:14px 12px}.msg{display:flex;gap:8px;margin:14px 0;align-items:flex-start}.msg.mine{flex-direction:row-reverse}.msg .avatar{width:38px;height:38px}.bubble{max-width:76%;padding:9px 11px;border-radius:5px;background:white;line-height:1.45;overflow-wrap:anywhere}.mine .bubble{background:#95ec69}.compose{height:56px;display:flex;gap:8px;align-items:center;padding:7px 10px;background:#f7f7f7;border-top:1px solid #ddd}.compose input{flex:1;min-width:0;border:0;padding:10px;background:white;border-radius:5px;outline:none}.send,.primary{background:#07c160;color:white;border-radius:5px;padding:9px 15px}.shade{position:absolute;inset:0;background:#0006;display:none;align-items:center;justify-content:center;padding:18px;z-index:9}.modal{background:white;border-radius:10px;width:min(430px,100%);padding:18px}.modal h3{margin:0 0 12px}.field{display:block;width:100%;padding:12px 8px;border:0;border-bottom:1px solid #eee;outline:none;margin:6px 0}.primary{width:100%;margin-top:12px;padding:12px}.upload{display:flex;gap:12px;align-items:center;margin:12px 0}.upload img{width:58px;height:58px;object-fit:cover;border-radius:5px}.mebox{display:flex;gap:14px;align-items:center;padding:24px 18px;margin-bottom:10px}.mebox .avatar{width:65px;height:65px}.discover{height:66px;display:flex;align-items:center;padding:0 18px;gap:16px;border-bottom:1px solid #eee}.discover b{font-size:22px;color:#576b95;width:28px}.post{padding:15px;border-bottom:1px solid #eee}.post img{max-width:75%;max-height:200px;display:block;margin-top:10px}.hidden{display:none!important}
</style></head><body><main class="app"><div class="safe"></div><header class="head" id="head"><b class="title" id="title">微信</b><div class="actions"><button onclick="search()">⌕</button><button onclick="addMenu()">＋</button></div></header><section class="body" id="body"></section><nav class="nav" id="nav"><button data-t="chat" class="on" onclick="go('chat')"><svg viewBox="0 0 24 24"><path d="M3 5.5A3.5 3.5 0 0 1 6.5 2h11A3.5 3.5 0 0 1 21 5.5v8a3.5 3.5 0 0 1-3.5 3.5H9l-5 4v-5.5A3.5 3.5 0 0 1 3 12z"/></svg>微信</button><button data-t="contacts" onclick="go('contacts')"><svg viewBox="0 0 24 24"><circle cx="9" cy="7" r="3.5"/><path d="M2.5 21v-2a6.5 6.5 0 0 1 13 0v2zM17 5h5M17 9h5"/></svg>通讯录</button><button data-t="discover" onclick="go('discover')"><svg viewBox="0 0 24 24"><path d="M12 2.5 14 9l7.5 3-7.5 3-2 6.5L10 15l-7.5-3L10 9z"/></svg>发现</button><button data-t="me" onclick="go('me')"><svg viewBox="0 0 24 24"><circle cx="12" cy="7" r="4"/><path d="M3 22a9 9 0 0 1 18 0"/></svg>我</button></nav><div class="shade" id="shade"><div class="modal" id="modal"></div></div></main>
<script>
const $=s=>document.querySelector(s),read=(k,d)=>{try{return JSON.parse(localStorage.getItem('wx_'+k))??d}catch{return d}},write=(k,v)=>localStorage.setItem('wx_'+k,JSON.stringify(v)),fallback='data:image/svg+xml,'+encodeURIComponent('<svg xmlns="http://www.w3.org/2000/svg" width="80" height="80"><rect width="100%" height="100%" fill="#dce8e2"/><circle cx="40" cy="29" r="15" fill="#a7c0b4"/><path d="M10 80Q15 48 40 48T70 80" fill="#a7c0b4"/></svg>'),safe=s=>String(s||'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
let people=read('people',[]),messages=read('messages',{}),moments=read('moments',[]),me=read('me',{name:'我',avatar:''}),tab='chat',active=null;
function avatar(x){return x||fallback}function now(){return new Date().toLocaleTimeString('zh-CN',{hour:'2-digit',minute:'2-digit'})}
function go(t){tab=t;active=null;$('#head').classList.remove('hidden');$('#nav').classList.remove('hidden');$('#title').textContent=({chat:'微信',contacts:'通讯录',discover:'发现',me:'我'})[t];document.querySelectorAll('.nav button').forEach(b=>b.classList.toggle('on',b.dataset.t===t));render()}
function render(){let b=$('#body');b.innerHTML='';if(tab==='chat'){let a=[...people].sort((x,y)=>(messages[y.id]?.at||0)-(messages[x.id]?.at||0));if(!a.length)b.innerHTML='<div class="empty">还没有聊天<br>点击右上角「＋」即可添加朋友</div>';a.forEach(p=>{let m=(messages[p.id]||[]).slice(-1)[0];b.insertAdjacentHTML('beforeend',`<div class="row" onclick="chat('${p.id}')"><img class="avatar" src="${avatar(p.avatar)}"><div class="info"><div class="name">${safe(p.name)}</div><div class="preview">${safe(m?.text||'')}</div></div><div class="time">${m?.time||''}</div></div>`)})}
if(tab==='contacts'){b.innerHTML='<div class="search" onclick="search()">⌕ 搜索</div><div class="contact" role="button" style="cursor:pointer" onclick="newPerson()"><div class="avatar" style="background:#07c160;color:white;display:grid;place-items:center;font-size:25px">＋</div>新的朋友</div><div class="label">我的好友</div>';if(!people.length)b.insertAdjacentHTML('beforeend','<div class="empty">暂无联系人<br>点击右上角「＋」添加朋友，或点这里的「新的朋友」</div>');people.forEach(p=>b.insertAdjacentHTML('beforeend',`<div class="contact" onclick="profile('${p.id}')"><img class="avatar" src="${avatar(p.avatar)}">${safe(p.name)}</div>`))}
if(tab==='discover')b.innerHTML='<div class="discover" onclick="showMoments()"><b>◎</b>朋友圈　<span style="margin-left:auto;color:#aaa">›</span></div><div class="discover"><b>⌁</b>视频号</div><div class="discover"><b>◇</b>扫一扫</div><div class="discover"><b>▤</b>小程序</div>';
if(tab==='me')b.innerHTML=`<div class="mebox" onclick="editMe()"><img class="avatar" src="${avatar(me.avatar)}"><div class="info"><div class="name">${safe(me.name)}</div><div class="preview">微信号：mywechat</div></div>›</div><div class="discover">收藏</div><div class="discover" onclick="showMoments()">朋友圈</div><div class="discover">设置</div>`}
}
function showModal(s){$('#modal').innerHTML=s;$('#shade').style.display='flex'}function close(){ $('#shade').style.display='none'}$('#shade').onclick=e=>{if(e.target.id==='shade')close()}
function addMenu(){newPerson()}
function imageInput(id,preview){$(id).onchange=e=>{let f=e.target.files[0];if(!f)return;let r=new FileReader();r.onload=()=>$(preview).src=r.result;r.readAsDataURL(f)}}
function newPerson(){showModal('<h3>添加朋友</h3><div class="upload"><img id="pv" src="'+fallback+'"><label style="color:#07c160">选择头像<input id="file" type="file" accept="image/*" hidden></label></div><input class="field" id="nm" placeholder="请输入昵称"><input class="field" id="wxid" placeholder="微信号（选填）"><button class="primary" onclick="savePerson()">添加到通讯录</button>');imageInput('#file','#pv')}
function savePerson(){let n=$('#nm').value.trim();if(!n){alert('请填写昵称');return}let a=$('#pv').src;people.push({id:'p'+Date.now(),name:n,wx:$('#wxid').value,avatar:a===fallback?'':a});write('people',people);close();go('contacts')}
function chat(id){active=id;let p=people.find(x=>x.id===id);$('#head').classList.add('hidden');$('#nav').classList.add('hidden');let b=$('#body');b.innerHTML=`<div class="chathead"><button onclick="go('chat')" style="font-size:25px">‹</button><b>${safe(p.name)}</b><button onclick="profile('${id}')">···</button></div><div class="chatarea" id="chatarea"></div><div class="compose"><input id="msg" placeholder="发送消息"><button class="send" onclick="send()">发送</button></div>`;draw()}
function draw(){let a=$('#chatarea');a.innerHTML=(messages[active]||[]).map(m=>`<div class="msg ${m.mine?'mine':''}"><img class="avatar" src="${avatar(m.mine?me.avatar:people.find(p=>p.id===active)?.avatar)}"><div class="bubble">${safe(m.text)}</div></div>`).join('');a.scrollTop=a.scrollHeight}
function send(){let v=$('#msg').value.trim();if(!v)return;messages[active]=messages[active]||[];messages[active].push({text:v,mine:true,time:now()});messages[active].at=Date.now();write('messages',messages);draw();$('#msg').value=''}
function profile(id){let p=people.find(x=>x.id===id);showModal(`<h3>朋友资料</h3><div class="upload"><img id="epv" src="${avatar(p.avatar)}"><label style="color:#07c160">修改头像<input id="efile" type="file" accept="image/*" hidden></label></div><input class="field" id="en" value="${safe(p.name)}" placeholder="昵称"><input class="field" id="ew" value="${safe(p.wx||'')}" placeholder="微信号"><button class="primary" onclick="saveProfile('${id}')">保存</button><button class="field" style="color:#d44" onclick="del('${id}')">删除联系人</button>`);imageInput('#efile','#epv')}
function saveProfile(id){let p=people.find(x=>x.id===id);p.name=$('#en').value.trim()||p.name;p.wx=$('#ew').value;p.avatar=$('#epv').src;write('people',people);close();active===id?chat(id):render()}
function del(id){if(!confirm('确定删除联系人？'))return;people=people.filter(p=>p.id!==id);delete messages[id];write('people',people);write('messages',messages);close();go('contacts')}
function search(){showModal('<h3>搜索联系人</h3><input class="field" id="query" placeholder="输入昵称"><button class="primary" onclick="doSearch()">搜索</button>')}
function doSearch(){let q=$('#query').value;close();tab='contacts';$('#title').textContent='通讯录';$('#body').innerHTML=people.filter(p=>p.name.includes(q)).map(p=>`<div class="contact" onclick="profile('${p.id}')"><img class="avatar" src="${avatar(p.avatar)}">${safe(p.name)}</div>`).join('')||'<div class="empty">没有找到联系人</div>'}
function editMe(){showModal('<h3>个人资料</h3><div class="upload"><img id="mpv" src="'+avatar(me.avatar)+'"><label style="color:#07c160">修改头像<input id="mfile" type="file" accept="image/*" hidden></label></div><input class="field" id="mn" value="'+safe(me.name)+'" placeholder="昵称"><button class="primary" onclick="saveMe()">保存</button>');imageInput('#mfile','#mpv')}
function saveMe(){me={name:$('#mn').value.trim()||'我',avatar:$('#mpv').src};write('me',me);close();render()}
function showMoments(){ $('#head').classList.add('hidden');$('#nav').classList.add('hidden');$('#body').innerHTML='<div class="chathead"><button onclick="go(\'discover\')">‹</button><b>朋友圈</b><button onclick="newMoment()">＋</button></div><div id="posts"></div>';drawMoments()}
function drawMoments(){$('#posts').innerHTML=moments.map(m=>`<div class="post"><b>${safe(me.name)}</b><div style="margin-top:10px">${safe(m.text)}</div>${m.image?'<img src="'+m.image+'">':''}<div class="preview">${m.time}</div></div>`).join('')||'<div class="empty">还没有朋友圈</div>'}
function newMoment(){showModal('<h3>发表朋友圈</h3><textarea id="mt" class="field" rows="4" placeholder="这一刻的想法..."></textarea><div class="upload"><label style="color:#07c160">添加图片<input id="mf" type="file" accept="image/*" hidden></label><img id="mp" style="display:none"></div><button class="primary" onclick="saveMoment()">发表</button>');$('#mf').onchange=e=>{let r=new FileReader();r.onload=()=>{$('#mp').src=r.result;$('#mp').style.display='block'};r.readAsDataURL(e.target.files[0])}}
function saveMoment(){let t=$('#mt').value.trim(),im=$('#mp').src;if(!t&&!im)return;moments.unshift({text:t,image:im&&im!=='undefined'?im:'',time:now()});write('moments',moments);close();drawMoments()}
render();
</script></body></html>
