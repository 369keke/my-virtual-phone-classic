<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover"><meta name="theme-color" content="#f5f5f5"><title>微博 · 小手机</title><link rel="stylesheet" href="./weibo.css"></head><body><main class="wb-app">
<header class="wb-head"><button id="backBtn" class="wb-back" aria-label="返回">‹</button><strong>微博</strong><button id="exitBtn" aria-label="返回桌面">⌂</button></header>
<div class="wb-pages">
<section class="wb-page active" data-page="home"><div class="wb-toolbar"><button class="wb-chip active" id="feedRecommend">推荐</button><button class="wb-chip" id="feedFollowing">关注</button><input class="wb-search" id="hotQuery" placeholder="⌕ 搜索热搜、微博、用户"></div><div class="wb-scroll" id="feedList"></div><button class="wb-fab" id="publishBtn">＋</button></section>
<section class="wb-page" data-page="hot"><div class="wb-toolbar"><input class="wb-search" id="hotQueryUnused" placeholder="⌕ 搜索热搜、微博、用户"></div><div class="wb-scroll"><div class="wb-section-title">实时热搜　<span style="font-size:11px;color:#aaa;font-weight:400">模拟榜单</span></div><div class="wb-hot-search" id="hotList"></div><div class="wb-empty">热搜内容为本地模拟，不连接真实微博</div></div></section>
<section class="wb-page" data-page="search"><div class="wb-toolbar"><button id="searchBack">‹</button><input class="wb-search" id="searchInput" placeholder="搜索微博内容"></div><div class="wb-scroll" id="searchResults"></div></section>
<section class="wb-page" data-page="detail"><div class="wb-toolbar"><button id="detailBack">‹ 返回</button><b>微博正文</b></div><div class="wb-scroll"><div id="detailPost"></div><div class="wb-section-title">全部评论</div><div style="background:#fff;padding:0 14px" id="commentList"></div></div><div class="wb-comment-compose"><input id="commentInput" placeholder="说点什么…"><button id="commentSend" style="color:#f56b35;font-weight:600">发送</button></div></section>
<section class="wb-page" data-page="profile"><div class="wb-scroll"><div class="wb-profile-cover"></div><div class="wb-profile-card"><div class="wb-profile-top"><div id="profileAvatar"></div><div style="padding-bottom:5px"><b id="profileName">我的主页</b><div class="wb-meta" id="profileId"></div></div></div><div class="wb-stats"><span><b id="profilePosts">0</b>微博</span><span><b id="profileFollowing">0</b>关注</span><span><b id="profileFans">0</b>粉丝</span><span><b id="profileLikes">0</b>获赞</span></div><p id="profileRoleHint" style="font-size:12px;color:#888"></p><div style="display:flex;gap:8px;flex-wrap:wrap"><button class="wb-btn" id="roleBtn">切换发布身份</button><button class="wb-btn" id="profileFollowBtn" hidden>关注</button></div></div><div class="wb-section-title">我的微博</div><div id="myPosts"></div></div></section>
</div>
<nav class="wb-tabs"><button class="active" data-go="home"><span>⌂</span>首页</button><button data-go="hot"><span>♨</span>热搜</button><button id="publishBtnTab"><span style="font-size:25px;color:#f56b35">＋</span>发布</button><button data-go="search"><span>⌕</span>发现</button><button data-go="profile"><span>◉</span>我</button></nav>
<div class="wb-panel" id="panel"><div class="wb-sheet" id="panelBody"></div></div><div class="wb-toast" id="toast"></div>
</main><script src="./weibo.js"></script></body></html>
